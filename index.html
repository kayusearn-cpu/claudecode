<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Analysis</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        :root {
            --bg:        #F5F5F7;
            --surface:   #FFFFFF;
            --t1:        #1D1D1F;
            --t2:        #6E6E73;
            --t3:        #86868B;
            --sep:       rgba(0,0,0,0.08);
            --sep2:      rgba(0,0,0,0.14);
            --live:      #FF3B30;
            --r:         16px;
            --r2:        24px;
            --card-shadow: 0 1px 1px rgba(0,0,0,0.04),0 2px 8px rgba(0,0,0,0.05),0 0 0 0.5px rgba(0,0,0,0.05);
            --modal-shadow: 0 24px 64px rgba(0,0,0,0.22);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--t1);
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        /* ── Header ── */
        .hdr {
            position: sticky; top: 0; z-index: 100;
            height: 56px;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 0.5px solid var(--sep);
            display: flex; align-items: center; padding: 0 16px;
        }
        .hdr-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: none; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--t1); transition: background .15s; flex-shrink: 0;
        }
        .hdr-btn:hover { background: rgba(0,0,0,0.06); }
        .hdr-center { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .hdr-title { font-size: 16px; font-weight: 600; letter-spacing: -.3px; color: var(--t1); }

        /* ── Sport tabs ── */
        .tabs-bar {
            background: var(--surface);
            border-bottom: 0.5px solid var(--sep);
            padding: 10px 14px;
            display: flex; gap: 7px; overflow-x: auto;
        }
        .tab {
            padding: 6px 15px; border-radius: 100px;
            font-size: 14px; font-weight: 500; letter-spacing: -.2px;
            border: none; cursor: pointer; white-space: nowrap;
            transition: background .2s, color .2s, transform .2s;
        }
        .tab-on  { background: var(--t1); color: #fff; transform: scale(1.02); }
        .tab-off { background: var(--bg); color: var(--t2); }
        .tab-off:hover { background: #E8E8ED; }

        /* ── Page ── */
        .page { max-width: 640px; margin: 0 auto; padding: 0 14px 110px; }
        .page-in { animation: pgIn .3s ease forwards; }
        @keyframes pgIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

        .page-head { padding: 26px 0 20px; }
        .page-h1 { font-size: 30px; font-weight: 700; letter-spacing: -.6px; line-height: 1; margin-bottom: 4px; }
        .page-sub { font-size: 13px; color: var(--t3); font-weight: 400; }

        /* ── Stats strip ── */
        .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 9px; margin-bottom: 28px; }
        .stat {
            background: var(--surface); border-radius: var(--r);
            box-shadow: var(--card-shadow);
            padding: 14px 10px; text-align: center;
        }
        .stat-n { font-size: 22px; font-weight: 700; letter-spacing: -.5px; line-height: 1; margin-bottom: 3px; }
        .stat-l { font-size: 10px; font-weight: 500; color: var(--t3); text-transform: uppercase; letter-spacing: .3px; }

        /* ── Group header ── */
        .grp {
            display: flex; align-items: center; gap: 10px;
            margin: 24px 0 10px;
        }
        .grp-line { flex:1; height:.5px; background:var(--sep2); }
        .grp-txt { font-size: 11px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }

        /* ── Match card ── */
        .card {
            background: var(--surface); border-radius: var(--r);
            box-shadow: var(--card-shadow);
            margin-bottom: 9px; overflow: hidden; cursor: pointer;
            transition: transform .14s ease, box-shadow .14s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .card:active  { transform: scale(.984); box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .card:hover   { box-shadow: 0 4px 22px rgba(0,0,0,0.1), 0 0 0 0.5px rgba(0,0,0,0.05); }
        .card-inner   { padding: 13px 15px 11px; }

        .card-meta {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 9px;
        }
        .card-league { font-size: 11px; font-weight: 500; color: var(--t3); text-transform: uppercase; letter-spacing: .2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
        .fav {
            background: none; border: none; cursor: pointer; padding: 2px;
            color: var(--sep2); transition: color .15s, transform .2s cubic-bezier(.34,1.56,.64,1);
            line-height: 0; flex-shrink: 0;
        }
        .fav:hover { transform: scale(1.25); }
        .fav.on { color: var(--live); }

        .card-body { display: flex; align-items: stretch; gap: 10px; }
        .card-teams { flex:1; display:flex; flex-direction:column; gap:5px; min-width:0; }
        .team-nm {
            font-size: 15px; font-weight: 600; letter-spacing: -.2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--t1);
        }
        .card-scores { display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0; min-width:22px; }
        .score-n { font-size: 15px; font-weight: 700; letter-spacing: -.2px; color: var(--t1); }
        .score-n.dim { color: var(--t3); font-weight: 400; }

        .card-foot {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 10px; padding-top: 9px;
            border-top: .5px solid var(--sep);
        }
        .status-row { display: flex; align-items: center; gap: 5px; }
        .dot { width:6px; height:6px; border-radius:50%; background:var(--live); animation:blink 1.6s ease-in-out infinite; flex-shrink:0; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
        .status-txt { font-size: 12px; font-weight: 600; color: var(--t2); letter-spacing: .1px; }
        .status-txt.live { color: var(--live); }
        .status-txt.dim  { color: var(--t3);   font-weight: 400; }

        .ai-pill {
            font-size: 11px; font-weight: 600; color: var(--t2);
            background: var(--bg); border: none; border-radius: 100px;
            padding: 4px 10px; cursor: pointer; letter-spacing: -.1px;
            transition: background .15s, color .15s; display: flex; align-items: center; gap: 4px;
        }
        .ai-pill:hover { background: var(--t1); color: #fff; }

        /* ── Empty / error ── */
        .empty {
            background: var(--surface); border-radius: var(--r);
            box-shadow: var(--card-shadow);
            padding: 36px 20px; text-align: center; margin-bottom: 9px;
        }
        .empty-t { font-size: 14px; font-weight: 600; color: var(--t2); letter-spacing: -.1px; }
        .empty-s { font-size: 12px; color: var(--t3); margin-top: 3px; }

        .err-bar {
            background: var(--surface); border-radius: var(--r);
            box-shadow: var(--card-shadow); border-left: 3px solid var(--live);
            padding: 13px 14px; display: flex; align-items: center;
            gap: 10px; margin-bottom: 14px;
        }
        .err-txt { flex:1; font-size: 13px; font-weight: 500; color: var(--t1); }
        .retry-btn {
            font-size: 11px; font-weight: 700; color: var(--t1);
            background: var(--bg); border: none; border-radius: 100px;
            padding: 5px 12px; cursor: pointer; flex-shrink: 0;
        }
        .wake-bar {
            background: var(--surface); border-radius: var(--r);
            box-shadow: var(--card-shadow);
            padding: 13px 14px; display: flex; align-items: center;
            gap: 10px; margin-bottom: 14px;
        }
        .wake-txt { font-size: 13px; font-weight: 500; color: var(--t2); }
        .alert-bar {
            background: var(--surface); border-radius: var(--r);
            box-shadow: var(--card-shadow); border-left: 2px solid #FF9F0A;
            padding: 11px 13px; display: flex; align-items: center;
            gap: 9px; margin-bottom: 12px;
        }
        .alert-txt { flex:1; font-size: 13px; font-weight: 500; color: var(--t1); }
        .x-btn { background:none; border:none; cursor:pointer; color:var(--t3); font-size:17px; line-height:1; }

        /* ── Skeleton ── */
        .skel-card { background:var(--surface); border-radius:var(--r); box-shadow:var(--card-shadow); padding:14px 15px; margin-bottom:9px; display:flex; flex-direction:column; gap:9px; }
        .skel { background: linear-gradient(90deg,var(--bg) 25%,#E8E8ED 50%,var(--bg) 75%); background-size:200% 100%; animation:shim 1.4s infinite; border-radius:5px; }
        @keyframes shim { from{background-position:200% 0} to{background-position:-200% 0} }

        /* ── Bottom nav ── */
        .nav {
            position: fixed; bottom:0; left:0; right:0;
            height: 80px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-top: .5px solid var(--sep);
            display: flex; align-items: flex-start; justify-content: space-around;
            padding-top: 11px; z-index: 100;
        }
        .nav-item { display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; min-width:56px; -webkit-tap-highlight-color:transparent; }
        .nav-ico  { width:26px; height:26px; display:flex; align-items:center; justify-content:center; }
        .nav-lbl  { font-size:10px; font-weight:500; letter-spacing:.1px; }
        .nav-item.on .nav-ico, .nav-item.on .nav-lbl { color:var(--t1); }
        .nav-item.off .nav-ico, .nav-item.off .nav-lbl { color:#C7C7CC; }
        .nav-item.on .nav-lbl { font-weight:600; }

        /* ── Modals ── */
        .overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.48); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); display:flex; align-items:flex-end; justify-content:center; }
        .sheet {
            background: var(--surface); border-radius: var(--r2) var(--r2) 0 0;
            width:100%; max-width:640px; max-height:90vh; overflow-y:auto;
            padding: 10px 22px 40px;
            animation: sheetUp .38s cubic-bezier(.32,.72,0,1) forwards;
        }
        @keyframes sheetUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
        .handle { width:34px; height:4px; background:var(--sep2); border-radius:2px; margin:0 auto 18px; }

        .center-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.46); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; padding:20px; }
        .center-card {
            background:var(--surface); border-radius:var(--r2);
            width:100%; max-width:340px; padding:32px 26px;
            box-shadow:var(--modal-shadow);
            animation:pop .28s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes pop { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }

        /* ── Prediction sheet ── */
        .pred-league-row { text-align:center; margin-bottom:20px; }
        .pred-league-nm { font-size:12px; font-weight:600; color:var(--t2); text-transform:uppercase; letter-spacing:.5px; }
        .pred-badge { display:inline-block; font-size:10px; font-weight:600; color:var(--t3); background:var(--bg); padding:3px 9px; border-radius:100px; margin-top:5px; letter-spacing:.2px; }
        .pred-teams { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:12px; }
        .pred-team { flex:1; text-align:center; }
        .pred-logo { width:56px; height:56px; object-fit:contain; margin:0 auto 7px; display:block; }
        .pred-team-nm { font-size:12px; font-weight:600; letter-spacing:-.1px; }
        .pred-vs { font-size:12px; font-weight:600; color:var(--t3); flex-shrink:0; }
        .pred-box { background:var(--t1); border-radius:var(--r); padding:18px; margin-bottom:20px; }
        .pred-advice { font-size:19px; font-weight:700; color:#fff; letter-spacing:-.4px; text-align:center; margin-bottom:14px; line-height:1.3; }
        .pred-bar { height:3px; background:rgba(255,255,255,.15); border-radius:2px; overflow:hidden; display:flex; margin-bottom:9px; }
        .pb-h { background:#fff; } .pb-d { background:rgba(255,255,255,.4); } .pb-a { background:rgba(255,255,255,.7); }
        .pred-pct { display:flex; justify-content:space-between; font-size:10px; font-weight:600; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.3px; }
        .pred-cmp-lbl { font-size:12px; font-weight:600; color:var(--t2); margin-bottom:14px; letter-spacing:-.1px; }
        .cmp-row { margin-bottom:12px; }
        .cmp-labels { display:flex; justify-content:space-between; margin-bottom:5px; }
        .cmp-val { font-size:11px; font-weight:600; color:var(--t1); }
        .cmp-name { font-size:10px; font-weight:500; color:var(--t3); text-transform:uppercase; letter-spacing:.3px; }
        .cmp-track { height:2px; background:var(--bg); border-radius:1px; overflow:hidden; }
        .cmp-fill  { height:100%; background:var(--t1); border-radius:1px; }
        .sheet-close { width:100%; background:var(--t1); color:#fff; border:none; border-radius:var(--r); padding:14px; font-weight:700; font-size:15px; cursor:pointer; letter-spacing:-.2px; margin-top:20px; }

        /* ── Loading overlay ── */
        .pred-loading { position:fixed; inset:0; z-index:210; background:rgba(255,255,255,.65); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; }
        .pred-loading-box { background:var(--surface); border-radius:var(--r2); box-shadow:var(--modal-shadow); padding:28px 36px; display:flex; flex-direction:column; align-items:center; gap:12px; }
        .pred-loading-txt { font-size:12px; font-weight:600; color:var(--t2); text-transform:uppercase; letter-spacing:.3px; }
        .spin { width:24px; height:24px; border:2px solid var(--sep2); border-top-color:var(--t1); border-radius:50%; animation:rot .7s linear infinite; }
        @keyframes rot { to{transform:rotate(360deg)} }

        /* ── Splash ── */
        .splash { position:fixed; inset:0; z-index:300; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; animation:splFade .5s ease forwards; animation-delay:2.6s; pointer-events:none; }
        @keyframes splFade { to{opacity:0} }
        .splash-inner { animation:splPop .55s cubic-bezier(.34,1.56,.64,1) forwards; display:flex; flex-direction:column; align-items:center; gap:14px; }
        @keyframes splPop { from{opacity:0;transform:scale(.82)} to{opacity:1;transform:scale(1)} }

        /* ── Settings ── */
        .settings-group { background:var(--surface); border-radius:var(--r); box-shadow:var(--card-shadow); overflow:hidden; margin-bottom:18px; }
        .settings-row-item { display:flex; align-items:center; justify-content:space-between; padding:15px 16px; text-decoration:none; color:var(--t1); font-size:15px; font-weight:500; letter-spacing:-.2px; border-bottom:.5px solid var(--sep); transition:background .1s; }
        .settings-row-item:last-child { border-bottom:none; }
        .settings-row-item:hover { background:var(--bg); }

        /* ── Calendar ── */
        .cal-days { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
        .cal-day { display:flex; flex-direction:column; align-items:center; padding:9px 5px; border-radius:11px; cursor:pointer; transition:background .15s; border: .5px solid transparent; }
        .cal-day.on { background:var(--t1); }
        .cal-day.on .cal-dd { color:rgba(255,255,255,.65); }
        .cal-day.on .cal-dn { color:#fff; }
        .cal-day:not(.on):hover { background:var(--bg); }
        .cal-dd { font-size:9px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px; }
        .cal-dn { font-size:16px; font-weight:700; color:var(--t1); letter-spacing:-.3px; }

        /* ── Social ── */
        .social { padding:36px 0 16px; text-align:center; }
        .social-lbl { font-size:10px; font-weight:500; color:var(--t3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:18px; }
        .social-row { display:flex; justify-content:center; gap:14px; }
        .social-ico { width:42px; height:42px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--t1); text-decoration:none; transition:background .15s, transform .18s; }
        .social-ico:hover { background:var(--t1); color:#fff; transform:translateY(-2px); }

        /* ── Notification card ── */
        .notif-card { animation:notifDrop .55s cubic-bezier(.175,.885,.32,1.275) both; }
        @keyframes notifDrop { from{transform:translateY(-20px);opacity:0} to{transform:translateY(0);opacity:1} }
        .opacity-0 { opacity:0; }
        .anim-fill { animation-fill-mode:forwards; }

        /* ── Confirm btn ── */
        .confirm-btn { width:100%; background:var(--t1); color:#fff; border:none; border-radius:var(--r); padding:14px; font-weight:700; font-size:15px; cursor:pointer; letter-spacing:-.2px; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const BRAND_LOGO  = "https://magicbettingtips.com/logo.png";
const BACKEND_URL = "https://sportprediction.onrender.com";

/* ── Status helpers ── */
const FIN  = ['FT','AET','PEN','Pen.'];
const CANC = ['Postp.','Canc.','Susp.','WO','AWD','ABD'];
const UPC  = ['NS','TBD'];
const TIME_RE     = /^\d{2}:\d{2}$/;
const FT_SCORE_RE = /\[(\d+)-(\d+)\]/;

const cat = s => {
    if (!s) return 'unknown';
    if (FIN.includes(s))  return 'finished';
    if (CANC.includes(s)) return 'cancelled';
    if (UPC.includes(s))  return 'upcoming';
    if (TIME_RE.test(s))  return 'upcoming';
    return 'live';
};

const statusLabel = s => {
    if (!s) return '';
    if (s === 'HT')  return 'Half Time';
    if (s === 'FT')  return 'Full Time';
    if (s === 'AET') return 'AET';
    if (s === 'PEN' || s === 'Pen.') return 'Penalties';
    if (s === 'ET')  return 'Extra Time';
    if (s === 'BT')  return 'Break';
    if (TIME_RE.test(s)) return s;
    const n = parseInt(s);
    if (!isNaN(n)) return `${n}'`;
    return s;
};

const getGoals = m => {
    const c = cat(m.status);
    if (c === 'finished') {
        const raw = m.ft?.score;
        if (raw) { const x = FT_SCORE_RE.exec(raw); if (x) return { h: x[1], a: x[2] }; }
    }
    const h = m.home?.goals, a = m.away?.goals;
    if (h == null || h === '?' || a == null || a === '?') return null;
    return { h: String(h), a: String(a) };
};

const fid = m => m?.static_id || m?.id || m?.fixture?.id || null;

/* ── SVG Icons ── */
const Ico = ({ d, w=22, h=22, fill="none", stroke="currentColor", sw=2 }) => (
    <svg width={w} height={h} viewBox="0 0 24 24" fill={fill} stroke={stroke} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
        <path d={d}/>
    </svg>
);
const IcoHome     = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>;
const IcoBell     = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>;
const IcoHeart    = ({ on }) => <svg width="17" height="17" viewBox="0 0 24 24" fill={on?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>;
const IcoMenu     = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
const IcoCal      = () => <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
const IcoRefresh  = () => <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>;
const IcoChev     = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
const IcoZap      = () => <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
const IcoIG       = () => <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>;
const IcoTG       = () => <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
const IcoX        = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>;

const MagicLogo = ({ size=26 }) => (
    <img src={BRAND_LOGO} width={size} height={size}
        style={{ objectFit:'contain', borderRadius:7, flexShrink:0 }}
        alt="Magic" onError={e => e.target.style.display='none'} />
);

/* ── Skeleton ── */
const Skel = () => (
    <div className="skel-card">
        <div className="skel" style={{height:9,width:'45%'}}/>
        <div style={{display:'flex',justifyContent:'space-between'}}>
            <div className="skel" style={{height:13,width:'52%'}}/>
            <div className="skel" style={{height:13,width:18}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between'}}>
            <div className="skel" style={{height:13,width:'42%'}}/>
            <div className="skel" style={{height:13,width:18}}/>
        </div>
        <div className="skel" style={{height:.5,width:'100%'}}/>
        <div style={{display:'flex',justifyContent:'space-between'}}>
            <div className="skel" style={{height:9,width:55}}/>
            <div className="skel" style={{height:9,width:75}}/>
        </div>
    </div>
);

/* ── Match Card ── */
const MatchCard = ({ match, onSelect, onToggleFav, isFav, isNotif=false, idx=0 }) => {
    const c   = cat(match.status);
    const lbl = statusLabel(match.status);
    const g   = getGoals(match);
    const id  = fid(match);
    return (
        <div
            className={`card${isNotif?' notif-card opacity-0 anim-fill':''}`}
            style={{ animationDelay: isNotif ? `${idx*3}s` : '0s' }}
            onClick={() => id && onSelect()}
        >
            <div className="card-inner">
                <div className="card-meta">
                    <span className="card-league">{(match.country||'').toUpperCase()}{match.country&&match.leagueName?' · ':''}{match.leagueName||''}</span>
                    <button className={`fav${isFav?' on':''}`}
                        onClick={e=>{e.stopPropagation();if(id)onToggleFav(id);}}>
                        <IcoHeart on={isFav}/>
                    </button>
                </div>
                <div className="card-body">
                    <div className="card-teams">
                        <span className="team-nm">{match.home?.name||'—'}</span>
                        <span className="team-nm">{match.away?.name||'—'}</span>
                    </div>
                    <div className="card-scores">
                        {g
                            ? <><span className="score-n">{g.h}</span><span className="score-n">{g.a}</span></>
                            : <><span className="score-n dim">—</span><span className="score-n dim">—</span></>
                        }
                    </div>
                </div>
                <div className="card-foot">
                    <div className="status-row">
                        {c==='live' && <span className="dot"/>}
                        <span className={`status-txt${c==='live'?' live':c==='finished'?' dim':''}`}>{lbl}</span>
                    </div>
                    {id && (
                        <button className="ai-pill" onClick={e=>{e.stopPropagation();onSelect();}}>
                            <IcoZap/> AI Prediction
                        </button>
                    )}
                </div>
            </div>
        </div>
    );
};

/* ── Prediction sheet ── */
const PredSheet = ({ data, onClose }) => {
    const { predictions, teams, comparison, league } = data;
    return (
        <div className="overlay" onClick={onClose}>
            <div className="sheet" onClick={e=>e.stopPropagation()}>
                <div className="handle"/>
                {(!predictions||!teams||!league) ? (
                    <>
                        <p style={{textAlign:'center',color:'var(--t3)',fontSize:14,padding:'20px 0'}}>No prediction data for this match.</p>
                        <button className="sheet-close" onClick={onClose}>Close</button>
                    </>
                ) : (
                    <>
                        <div className="pred-league-row">
                            <img src={league.logo} width={36} height={36} style={{objectFit:'contain',margin:'0 auto 6px',display:'block'}} onError={e=>e.target.style.display='none'} alt=""/>
                            <div className="pred-league-nm">{league.name}</div>
                            <div className="pred-badge">AI Intelligence v4.2</div>
                        </div>
                        <div className="pred-teams">
                            <div className="pred-team">
                                <img src={teams.home?.logo} className="pred-logo" onError={e=>e.target.style.display='none'} alt=""/>
                                <div className="pred-team-nm">{teams.home?.name}</div>
                            </div>
                            <div className="pred-vs">vs</div>
                            <div className="pred-team">
                                <img src={teams.away?.logo} className="pred-logo" onError={e=>e.target.style.display='none'} alt=""/>
                                <div className="pred-team-nm">{teams.away?.name}</div>
                            </div>
                        </div>
                        <div className="pred-box">
                            <div className="pred-advice">{predictions.advice}</div>
                            <div className="pred-bar">
                                <div className="pb-h" style={{width:predictions.percent?.home}}/>
                                <div className="pb-d" style={{width:predictions.percent?.draw}}/>
                                <div className="pb-a" style={{width:predictions.percent?.away}}/>
                            </div>
                            <div className="pred-pct">
                                <span>Home {predictions.percent?.home}</span>
                                <span>Draw {predictions.percent?.draw}</span>
                                <span>Away {predictions.percent?.away}</span>
                            </div>
                        </div>
                        {comparison && (
                            <div style={{marginBottom:6}}>
                                <div className="pred-cmp-lbl">Team Comparison</div>
                                {[
                                    {n:'Attack', h:comparison.att?.home, a:comparison.att?.away},
                                    {n:'Defense',h:comparison.def?.home, a:comparison.def?.away},
                                    {n:'Form',   h:comparison.form?.home,a:comparison.form?.away},
                                ].filter(r=>r.h).map(r=>(
                                    <div key={r.n} className="cmp-row">
                                        <div className="cmp-labels">
                                            <span className="cmp-val">{r.h}</span>
                                            <span className="cmp-name">{r.n}</span>
                                            <span className="cmp-val">{r.a}</span>
                                        </div>
                                        <div className="cmp-track"><div className="cmp-fill" style={{width:r.h}}/></div>
                                    </div>
                                ))}
                            </div>
                        )}
                        <button className="sheet-close" onClick={onClose}>Close</button>
                    </>
                )}
            </div>
        </div>
    );
};

/* ── Social footer ── */
const Social = () => (
    <div className="social">
        <div className="social-lbl">Follow Us</div>
        <div className="social-row">
            <a href="#" className="social-ico"><IcoIG/></a>
            <a href="#" className="social-ico"><IcoTG/></a>
            <a href="#" className="social-ico"><IcoX/></a>
        </div>
    </div>
);

/* ── Grp header ── */
const Grp = ({ label }) => (
    <div className="grp">
        <div className="grp-line"/><span className="grp-txt">{label}</span><div className="grp-line"/>
    </div>
);

/* ── App ── */
function App() {
    const [splash,    setSplash]    = useState(true);
    const [calOpen,   setCalOpen]   = useState(false);
    const [tab,       setTab]       = useState('Home');
    const [sport,     setSport]     = useState('Football');
    const [favs,      setFavs]      = useState([]);
    const [matches,   setMatches]   = useState([]);
    const [loading,   setLoading]   = useState(true);
    const [waking,    setWaking]    = useState(false);
    const [err,       setErr]       = useState(null);
    const [pred,      setPred]      = useState(null);
    const [predLoad,  setPredLoad]  = useState(false);
    const [predErr,   setPredErr]   = useState(null);
    const [csSport,   setCsSport]   = useState(null);

    const load = useCallback(async () => {
        setLoading(true); setErr(null);
        const wt = setTimeout(() => setWaking(true), 4000);
        try {
            const ctrl = new AbortController();
            const tt   = setTimeout(() => ctrl.abort(), 35000);
            const res  = await fetch(`${BACKEND_URL}/api/scores`, { signal: ctrl.signal });
            clearTimeout(tt); clearTimeout(wt); setWaking(false);
            if (!res.ok) throw new Error(`${res.status}`);
            const data = await res.json();
            if (data.livescore?.league) {
                const flat = [];
                const leagues = Array.isArray(data.livescore.league) ? data.livescore.league : [data.livescore.league];
                leagues.forEach(lg => {
                    if (!lg.match) return;
                    const items = Array.isArray(lg.match) ? lg.match : [lg.match];
                    items.forEach(m => flat.push({ ...m, leagueName: lg.name, country: lg.country }));
                });
                setMatches(flat);
            } else throw new Error("Bad format");
        } catch(e) {
            clearTimeout(wt); setWaking(false);
            setErr(e.name==='AbortError' ? "Server taking too long. Retry in a moment." : "Could not load data. Check connection.");
        } finally { setLoading(false); }
    }, []);

    useEffect(() => {
        const t = setTimeout(() => setSplash(false), 3000);
        load();
        const iv = setInterval(load, 60000);
        return () => { clearTimeout(t); clearInterval(iv); };
    }, [load]);

    const fetchPred = useCallback(async m => {
        const id = fid(m);
        if (!id) { setPredErr("No fixture ID — prediction unavailable."); return; }
        setPredErr(null); setPredLoad(true);
        try {
            const res  = await fetch(`${BACKEND_URL}/api/get-predictions?fixture=${id}`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            const p = data.response?.[0] || null;
            if (!p) throw new Error();
            setPred(p);
        } catch { setPredErr("Prediction not available for this match."); }
        finally { setPredLoad(false); }
    }, []);

    const toggleFav = useCallback(id => {
        if (!id) return;
        setFavs(p => p.includes(id) ? p.filter(f=>f!==id) : [...p,id]);
    }, []);

    const live  = useMemo(() => matches.filter(m => cat(m.status)==='live').slice(0,20),     [matches]);
    const past  = useMemo(() => matches.filter(m => cat(m.status)==='finished').slice(0,20), [matches]);
    const upc   = useMemo(() => matches.filter(m => cat(m.status)==='upcoming').slice(0,20), [matches]);
    const saved = useMemo(() => matches.filter(m => favs.includes(fid(m))),                  [matches,favs]);
    const alerts= useMemo(() => matches.filter(m => { const n=parseInt(m.status); return !isNaN(n)&&n>=75&&n<120; }).slice(0,15), [matches]);

    const card = (m, extra={}) => (
        <MatchCard key={fid(m)||`${m.home?.name}${m.away?.name}${m.status}`}
            match={m} onSelect={()=>fetchPred(m)}
            onToggleFav={toggleFav} isFav={favs.includes(fid(m))} {...extra}/>
    );

    const today = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    const sports = [['Football','⚽'],['Basketball','🏀'],['Tennis','🎾'],['Hockey','🏒'],['Baseball','⚾']];

    const calDays = () => {
        const t = new Date(), s = t.getDate()-t.getDay()+1;
        return Array.from({length:5},(_,i)=>{
            const d = new Date(t.getFullYear(),t.getMonth(),s+i);
            return { nm:d.toLocaleDateString('en-US',{weekday:'short'}), dn:d.getDate(), full:d.toDateString(), on:d.toDateString()===t.toDateString() };
        });
    };

    return (
        <>
            {/* Splash */}
            {splash && (
                <div className="splash">
                    <div className="splash-inner">
                        <div style={{width:76,height:76,background:'#fff',borderRadius:18,boxShadow:'0 8px 32px rgba(0,0,0,0.12)',display:'flex',alignItems:'center',justifyContent:'center',border:'.5px solid rgba(0,0,0,0.06)'}}>
                            <MagicLogo size={58}/>
                        </div>
                        <div style={{textAlign:'center'}}>
                            <div style={{fontSize:22,fontWeight:700,letterSpacing:'-.5px',color:'var(--t1)'}}>Magic Analysis</div>
                            <div style={{fontSize:13,color:'var(--t3)',marginTop:2}}>Live Football Intelligence</div>
                        </div>
                    </div>
                </div>
            )}

            {/* Header */}
            <header className="hdr">
                <button className="hdr-btn" onClick={()=>setCalOpen(true)}><IcoCal/></button>
                <div className="hdr-center">
                    <MagicLogo size={22}/>
                    <span className="hdr-title">Magic Analysis</span>
                </div>
                <button className="hdr-btn" onClick={load} title="Refresh"><IcoRefresh/></button>
            </header>

            {/* Sport tabs */}
            <div className="tabs-bar">
                {sports.map(([nm,ic])=>(
                    <button key={nm} className={`tab ${sport===nm?'tab-on':'tab-off'}`}
                        onClick={()=>nm==='Football'?setSport(nm):setCsSport(nm)}>
                        {ic} {nm}
                    </button>
                ))}
            </div>

            {/* Main */}
            <main className="page">

                {tab==='Home' && (
                    <div className="page-in">
                        <div className="page-head">
                            <h1 className="page-h1">Predictions</h1>
                            <p className="page-sub">{today}</p>
                        </div>

                        {/* Stats */}
                        <div className="stats">
                            {[['Live',live.length],['Past',past.length],['Upcoming',upc.length],['Alerts',alerts.length]].map(([l,v])=>(
                                <div key={l} className="stat">
                                    <div className="stat-n">{v}</div>
                                    <div className="stat-l">{l}</div>
                                </div>
                            ))}
                        </div>

                        {/* Banners */}
                        {waking && <div className="wake-bar"><div className="spin" style={{flexShrink:0}}/><span className="wake-txt">Waking up server — up to 30 s on first load…</span></div>}
                        {err && !loading && <div className="err-bar"><span className="err-txt">{err}</span><button className="retry-btn" onClick={load}>Retry</button></div>}
                        {predErr && <div className="alert-bar"><span className="alert-txt">{predErr}</span><button className="x-btn" onClick={()=>setPredErr(null)}>×</button></div>}

                        {/* Live */}
                        <Grp label="Live Now"/>
                        {loading ? [1,2,3].map(i=><Skel key={i}/>) : live.length>0 ? live.map(m=>card(m)) : <div className="empty"><div className="empty-t">No live matches right now</div><div className="empty-s">Live matches appear here automatically.</div></div>}

                        {/* Past */}
                        {!loading && past.length>0 && <><Grp label="Finished"/>{past.map(m=>card(m))}</>}

                        {/* Upcoming */}
                        {!loading && upc.length>0 && <><Grp label="Upcoming"/>{upc.map(m=>card(m))}</>}

                        <Social/>
                    </div>
                )}

                {tab==='Alerts' && (
                    <div className="page-in">
                        <div className="page-head">
                            <h1 className="page-h1">Alerts</h1>
                            <p className="page-sub">Matches past the 75 minute mark</p>
                        </div>
                        {alerts.length>0 ? alerts.map((m,i)=>card(m,{isNotif:true,idx:i})) : <div className="empty"><div className="empty-t">No alerts right now</div><div className="empty-s">Matches past 75 min appear here.</div></div>}
                        <Social/>
                    </div>
                )}

                {tab==='Favs' && (
                    <div className="page-in">
                        <div className="page-head">
                            <h1 className="page-h1">Saved</h1>
                            <p className="page-sub">Your saved matches</p>
                        </div>
                        {saved.length>0 ? saved.map(m=>card(m)) : (
                            <div style={{paddingTop:56,textAlign:'center'}}>
                                <div style={{fontSize:36,color:'var(--sep2)',marginBottom:10}}>♡</div>
                                <div className="empty-t">Nothing saved yet</div>
                                <div className="empty-s">Tap the heart on any match to save it here.</div>
                            </div>
                        )}
                        <Social/>
                    </div>
                )}

                {tab==='More' && (
                    <div className="page-in">
                        <div className="page-head"><h1 className="page-h1">More</h1></div>
                        <div className="settings-group">
                            {[
                                ['About Us','https://docs.google.com/document/d/1OaaYhaQi3FZzog6YLIoojh3CnX3aN0lrizXyQ5N9Dkw/edit?usp=sharing'],
                                ['Terms of Use','https://docs.google.com/document/d/1wO92_LRf7q1vS90SdmHgArGITPkimnMa7g_U_VHFZo4/edit?usp=sharing'],
                                ['Privacy Policy','https://docs.google.com/document/d/1qrcuBqJ3RoSTTdjtyHJXidpVNODILbHW5cLx4wlAe6Y/edit?usp=sharing'],
                            ].map(([lbl,url])=>(
                                <a key={lbl} href={url} target="_blank" rel="noopener noreferrer" className="settings-row-item">
                                    {lbl} <IcoChev/>
                                </a>
                            ))}
                        </div>
                        <div style={{textAlign:'center',paddingTop:8}}>
                            <div style={{fontSize:12,color:'var(--t3)'}}>Magic Analysis · v2.0</div>
                        </div>
                        <Social/>
                    </div>
                )}
            </main>

            {/* Calendar */}
            {calOpen && (
                <div className="center-overlay" onClick={()=>setCalOpen(false)}>
                    <div className="center-card" onClick={e=>e.stopPropagation()}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:22}}>
                            <div>
                                <div style={{fontSize:19,fontWeight:700,letterSpacing:'-.4px',marginBottom:2}}>This Week</div>
                                <div style={{fontSize:12,color:'var(--t3)'}}>Select a date</div>
                            </div>
                            <button onClick={()=>setCalOpen(false)} style={{background:'var(--bg)',border:'none',borderRadius:'50%',width:28,height:28,cursor:'pointer',fontSize:16,color:'var(--t2)',display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
                        </div>
                        <div className="cal-days">
                            {calDays().map(d=>(
                                <div key={d.full} className={`cal-day${d.on?' on':''}`}>
                                    <span className="cal-dd">{d.nm}</span>
                                    <span className="cal-dn">{d.dn}</span>
                                </div>
                            ))}
                        </div>
                        <button className="confirm-btn" style={{marginTop:22}} onClick={()=>setCalOpen(false)}>Confirm</button>
                    </div>
                </div>
            )}

            {/* Coming soon */}
            {csSport && (
                <div className="center-overlay" onClick={()=>setCsSport(null)}>
                    <div className="center-card" style={{textAlign:'center'}} onClick={e=>e.stopPropagation()}>
                        <div style={{fontSize:38,marginBottom:14}}>🔜</div>
                        <div style={{fontSize:21,fontWeight:700,letterSpacing:'-.4px',marginBottom:8}}>Coming Soon</div>
                        <div style={{fontSize:14,color:'var(--t2)',lineHeight:1.55,marginBottom:26}}>Live <strong>{csSport}</strong> scores and predictions are on the way.</div>
                        <button className="confirm-btn" onClick={()=>setCsSport(null)}>Got it</button>
                    </div>
                </div>
            )}

            {/* Prediction sheet */}
            {pred && <PredSheet data={pred} onClose={()=>setPred(null)}/>}

            {/* Prediction loading */}
            {predLoad && (
                <div className="pred-loading">
                    <div className="pred-loading-box">
                        <div className="spin" style={{width:26,height:26,borderWidth:2.5}}/>
                        <span className="pred-loading-txt">Loading prediction</span>
                    </div>
                </div>
            )}

            {/* Bottom nav */}
            <nav className="nav">
                {[
                    {id:'Home',   lbl:'Home',   ico:<IcoHome/>},
                    {id:'Alerts', lbl:'Alerts',  ico:<IcoBell/>},
                    {id:'Favs',   lbl:'Saved',   ico:<IcoHeart on={false}/>},
                    {id:'More',   lbl:'More',    ico:<IcoMenu/>},
                ].map(({id,lbl,ico})=>(
                    <div key={id} className={`nav-item ${tab===id?'on':'off'}`} onClick={()=>setTab(id)}>
                        <div className="nav-ico">{ico}</div>
                        <span className="nav-lbl">{lbl}</span>
                    </div>
                ))}
            </nav>
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
