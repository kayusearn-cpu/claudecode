<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Analysis | Predictions & Live Scores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; color: #1a1a1a; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeOut { from { opacity: 1; visibility: visible; } to { opacity: 0; visibility: hidden; } }
        .animate-fade-out { animation: fadeOut 0.8s ease-in-out forwards; animation-delay: 2.5s; }

        @keyframes drawCircle { to { stroke-dashoffset: 0; } }
        .animate-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawCircle 2.5s ease-in-out forwards; }

        @keyframes popUp { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: popUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-in { animation: slideIn 0.35s ease-out forwards; }

        @keyframes notificationDrop {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-notification {
            animation: notificationDrop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .tab-active { border: 2px solid #3b82f6; background-color: #1a1a1a !important; color: white !important; }
        .fill-mode-forwards { animation-fill-mode: forwards; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; display: inline-block; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        const BRAND_LOGO = "https://magicbettingtips.com/logo.png";
        const BACKEND_URL = "https://sportprediction.onrender.com";

        // ─── Status helpers ───────────────────────────────────────────────────────
        const FINISHED_STATUSES   = ['FT', 'AET', 'PEN'];
        const CANCELLED_STATUSES  = ['Postp.', 'Canc.', 'Susp.', 'WO', 'AWD', 'ABD'];
        const UPCOMING_STATUSES   = ['NS', 'TBD'];

        const getMatchCategory = (status) => {
            if (!status) return 'unknown';
            if (FINISHED_STATUSES.includes(status))  return 'finished';
            if (CANCELLED_STATUSES.includes(status)) return 'cancelled';
            if (UPCOMING_STATUSES.includes(status))  return 'upcoming';
            return 'live'; // 1H, HT, 2H, ET, P, BT, or a numeric minute string
        };

        const getStatusLabel = (status) => {
            if (!status)          return '';
            if (status === 'HT')  return 'HT';
            if (status === 'FT')  return 'FT';
            if (status === 'AET') return 'AET';
            if (status === 'PEN') return 'PEN';
            if (status === 'ET')  return 'ET';
            if (status === 'P')   return 'PEN';
            if (status === 'BT')  return 'BT';
            if (status === 'NS')  return 'Soon';
            const min = parseInt(status);
            if (!isNaN(min))      return `${min}'`;
            return status;
        };

        const getScore = (match) => {
            const h = match.home?.goals;
            const a = match.away?.goals;
            if (h === null || h === undefined || a === null || a === undefined) return 'vs';
            return `${h} - ${a}`;
        };

        const getFixtureId = (match) =>
            match?.static_id || match?.id || match?.fixture?.id || null;

        // ─── Icon components ──────────────────────────────────────────────────────
        const InstagramIcon = ({ size = 22 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
        );

        const XLogo = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
            </svg>
        );

        const MagicLogo = ({ size = 20, className = "" }) => (
            <img
                src={BRAND_LOGO}
                style={{ width: size, height: size }}
                className={`object-contain rounded-lg ${className}`}
                alt="Magic Logo"
                onError={(e) => { e.target.src = 'https://placehold.co/150x150?text=M'; }}
            />
        );

        // Stable Lucide icon — re-runs createIcons only when name/fill changes
        const LucideIcon = ({ name, size = 20, className = "", fill = "none" }) => {
            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [name, fill]);
            return (
                <i
                    data-lucide={name}
                    style={{ width: size, height: size }}
                    className={className}
                    {...(fill !== "none" ? { "data-lucide-fill": fill } : {})}
                ></i>
            );
        };

        // ─── UI sub-components ────────────────────────────────────────────────────

        const NavIcon = ({ icon, label, active }) => (
            <div className={`flex flex-col items-center gap-1.5 cursor-pointer transition-all ${active ? 'text-slate-900' : 'text-slate-300 hover:text-slate-500'}`}>
                <div className={`${active ? 'scale-110' : ''} transition-transform`}>{icon}</div>
                <span className={`text-[10px] font-black uppercase tracking-widest ${active ? 'opacity-100' : 'opacity-60'}`}>{label}</span>
                {active && <div className="w-5 h-1 bg-slate-900 rounded-full mt-0.5"></div>}
            </div>
        );

        const SocialButton = ({ icon, customIcon, color, label }) => (
            <a href="#" className="flex flex-col items-center gap-2 group">
                <div className={`w-12 h-12 ${color} rounded-2xl flex items-center justify-center text-white shadow-lg transition-transform group-hover:-translate-y-1`}>
                    {customIcon ? customIcon : <LucideIcon name={icon} size={22} />}
                </div>
                <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">{label}</span>
            </a>
        );

        const SocialFooter = () => (
            <div className="mt-12 mb-20 text-center px-4">
                <h3 className="text-[11px] font-black text-slate-400 uppercase tracking-[0.4em] mb-8">Follow Us</h3>
                <div className="flex justify-center gap-5 md:gap-8">
                    <SocialButton customIcon={<InstagramIcon />} color="bg-[#E1306C]" label="IG" />
                    <SocialButton icon="at-sign" color="bg-black" label="Thread" />
                    <SocialButton icon="send" color="bg-[#229ED9]" label="TG" />
                    <SocialButton customIcon={<XLogo />} color="bg-black" label="X" />
                </div>
            </div>
        );

        const StatBox = ({ label, count, color, bg, borderColor }) => (
            <div className={`${bg} ${borderColor} border rounded-2xl p-4 flex flex-col items-center justify-center shadow-sm transition-transform hover:scale-[1.02]`}>
                <span className={`text-[10px] font-black uppercase tracking-widest mb-1 ${color}`}>{label}</span>
                <span className="text-xl font-black text-slate-800">{count}</span>
            </div>
        );

        const StrengthBarDetail = ({ label, h, a }) => (
            <div className="flex items-center gap-6">
                <span className="text-xs font-black w-10 text-right text-slate-800">{h}</span>
                <div className="flex-1 flex flex-col items-center">
                    <span className="text-[9px] font-black text-slate-400 mb-2 tracking-widest uppercase">{label}</span>
                    <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden flex p-0.5 border border-slate-200">
                        <div className="h-full bg-blue-600 rounded-full" style={{ width: h }}></div>
                        <div className="flex-1 h-full"></div>
                        <div className="h-full bg-emerald-600 rounded-full" style={{ width: a }}></div>
                    </div>
                </div>
                <span className="text-xs font-black w-10 text-left text-slate-800">{a}</span>
            </div>
        );

        // ─── Match row ────────────────────────────────────────────────────────────

        const MatchRow = ({ match, onSelect, onToggleFav, isFav, isNotification = false, index = 0 }) => {
            const category = getMatchCategory(match.status);
            const isLive    = category === 'live';
            const statusLabel = getStatusLabel(match.status);
            const score = getScore(match);
            const fid = getFixtureId(match);

            return (
                <div
                    style={{ animationDelay: isNotification ? `${index * 3}s` : '0s' }}
                    className={`bg-white rounded-[1.5rem] border border-gray-100 p-5 shadow-sm hover:shadow-xl hover:border-blue-200 transition-all group relative overflow-hidden text-left mb-3 ${isNotification ? 'animate-notification opacity-0 fill-mode-forwards' : ''}`}
                >
                    <div className="grid grid-cols-12 items-center gap-2">
                        {/* Fav button */}
                        <div className="col-span-1 flex justify-center">
                            <button
                                onClick={(e) => { e.stopPropagation(); onToggleFav(fid); }}
                                className={`transition-all hover:scale-125 ${isFav ? 'text-red-500' : 'text-slate-200 hover:text-red-300'}`}
                            >
                                <LucideIcon name="heart" size={18} fill={isFav ? "currentColor" : "none"} />
                            </button>
                        </div>

                        {/* Team names */}
                        <div onClick={onSelect} className="col-span-5 flex flex-col items-start border-r border-gray-50 pr-4 cursor-pointer">
                            <div className="flex items-center gap-2 mb-1.5 text-[9px] font-black uppercase tracking-tighter">
                                <span className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">{match.country}</span>
                                <span className="text-slate-300 truncate max-w-[100px]">{match.leagueName}</span>
                            </div>
                            <div className="flex flex-col gap-1 w-full">
                                <span className="text-xs font-black text-slate-700 truncate group-hover:text-blue-600 transition-colors">{match.home?.name || '—'}</span>
                                <span className="text-xs font-black text-slate-700 truncate group-hover:text-blue-600 transition-colors">{match.away?.name || '—'}</span>
                            </div>
                        </div>

                        {/* Odds placeholders */}
                        <div className="col-span-1 text-[11px] font-bold text-slate-300 text-center">--</div>
                        <div className="col-span-1 text-[11px] font-bold text-slate-300 text-center">--</div>
                        <div className="col-span-1 text-[11px] font-bold text-slate-300 text-center">--</div>

                        {/* Prediction trigger */}
                        <div
                            onClick={fid ? onSelect : undefined}
                            className={`col-span-1 flex justify-center transition-colors ${fid ? 'text-orange-400 group-hover:text-orange-600 cursor-pointer' : 'text-slate-200 cursor-not-allowed'}`}
                            title={fid ? 'Get AI prediction' : 'No fixture ID available'}
                        >
                            <LucideIcon name="zap" size={16} />
                        </div>

                        {/* Score + status */}
                        <div onClick={fid ? onSelect : undefined} className={`col-span-2 flex flex-col items-center gap-1 ml-2 ${fid ? 'cursor-pointer' : ''}`}>
                            <div className={`px-4 py-1.5 rounded-xl text-xs font-black shadow-sm ${
                                isLive ? 'bg-red-500 text-white' :
                                category === 'finished' ? 'bg-slate-100 text-slate-500' :
                                category === 'upcoming' ? 'bg-blue-50 text-blue-500' :
                                'bg-slate-100 text-slate-400'
                            }`}>
                                {score}
                            </div>
                            <div className="flex items-center gap-1 text-[9px] font-black uppercase tracking-widest">
                                {isLive ? (
                                    <><div className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></div><span className="text-red-500">{statusLabel}</span></>
                                ) : (
                                    <span className="text-slate-400">{statusLabel}</span>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ─── Prediction modal ─────────────────────────────────────────────────────

        const PredictionView = ({ data, onClose }) => {
            const { predictions, teams, comparison, league } = data;
            if (!predictions || !teams || !league) {
                return (
                    <div className="bg-white rounded-[2rem] p-8 max-w-sm w-full text-center animate-pop shadow-2xl">
                        <button onClick={onClose} className="mb-6 w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center font-bold mx-auto hover:bg-slate-200">✕</button>
                        <p className="text-slate-500 font-bold text-sm">No prediction data available for this match.</p>
                    </div>
                );
            }
            return (
                <div className="bg-white rounded-[2rem] font-sans overflow-hidden p-8 max-w-lg w-full relative animate-pop shadow-2xl border border-white">
                    <button onClick={onClose} className="absolute top-8 right-8 w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center font-bold hover:bg-slate-200 transition-colors z-10">✕</button>
                    <div className="text-center mb-10">
                        <img src={league.logo} className="w-16 h-16 mx-auto mb-4 drop-shadow-xl" alt="" onError={(e) => e.target.style.display='none'} />
                        <h2 className="font-black text-2xl uppercase tracking-tighter leading-tight text-slate-900">{league.name}</h2>
                        <span className="text-[10px] font-black text-blue-500 uppercase tracking-widest bg-blue-50 px-3 py-1 rounded-full">AI Intelligence v4.2</span>
                    </div>
                    <div className="flex justify-between items-center mb-10 px-4">
                        <div className="text-center flex-1">
                            <img src={teams.home?.logo} className="w-20 h-20 mx-auto mb-3 drop-shadow-lg" alt="" onError={(e) => e.target.style.display='none'} />
                            <p className="font-black text-xs uppercase">{teams.home?.name}</p>
                        </div>
                        <div className="text-2xl font-black text-slate-200">VS</div>
                        <div className="text-center flex-1">
                            <img src={teams.away?.logo} className="w-20 h-20 mx-auto mb-3 drop-shadow-lg" alt="" onError={(e) => e.target.style.display='none'} />
                            <p className="font-black text-xs uppercase">{teams.away?.name}</p>
                        </div>
                    </div>
                    <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white mb-6 shadow-2xl text-center">
                        <div className="text-3xl font-black mb-4 tracking-tighter leading-none">{predictions.advice}</div>
                        <div className="flex h-3 w-full bg-white/10 rounded-full overflow-hidden mb-3">
                            <div className="bg-blue-500" style={{ width: predictions.percent?.home }}></div>
                            <div className="bg-slate-600" style={{ width: predictions.percent?.draw }}></div>
                            <div className="bg-emerald-500" style={{ width: predictions.percent?.away }}></div>
                        </div>
                        <div className="flex justify-between text-[10px] font-black uppercase opacity-60 tracking-widest">
                            <span>H: {predictions.percent?.home}</span>
                            <span>D: {predictions.percent?.draw}</span>
                            <span>A: {predictions.percent?.away}</span>
                        </div>
                    </div>
                    {comparison && (
                        <div className="space-y-6 px-4">
                            <StrengthBarDetail label="ATTACK INDEX"  h={comparison.att?.home} a={comparison.att?.away} />
                            <StrengthBarDetail label="DEFENSE INDEX" h={comparison.def?.home} a={comparison.def?.away} />
                        </div>
                    )}
                </div>
            );
        };

        const VIPGateIcon = ({ size = 60, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
                <rect x="12" y="24" width="6" height="32" rx="1" fill="currentColor" />
                <rect x="46" y="24" width="6" height="32" rx="1" fill="currentColor" />
                <circle cx="15" cy="20" r="4" fill="currentColor" />
                <circle cx="49" cy="20" r="4" fill="currentColor" />
                <rect x="8"  y="56" width="14" height="4" rx="2" fill="currentColor" />
                <rect x="42" y="56" width="14" height="4" rx="2" fill="currentColor" />
                <path d="M19 22C19 22 25 32 32 32C39 32 45 22 45 22" stroke="currentColor" strokeWidth="4" strokeLinecap="round" />
            </svg>
        );

        // ─── Empty / error states ─────────────────────────────────────────────────

        const EmptyState = ({ icon, title, sub }) => (
            <div className="bg-white rounded-3xl p-12 text-center border border-gray-100 mb-3">
                <LucideIcon name={icon} size={40} className="text-slate-100 mx-auto mb-4" />
                <p className="font-black text-slate-400 uppercase text-[10px] tracking-widest">{title}</p>
                {sub && <p className="text-xs text-slate-300 mt-2">{sub}</p>}
            </div>
        );

        const ErrorBanner = ({ message, onRetry }) => (
            <div className="bg-red-50 border border-red-100 rounded-2xl p-5 mb-6 flex items-start gap-4">
                <LucideIcon name="wifi-off" size={20} className="text-red-400 mt-0.5 shrink-0" />
                <div className="flex-1 min-w-0">
                    <p className="text-sm font-bold text-red-600">{message}</p>
                </div>
                <button
                    onClick={onRetry}
                    className="shrink-0 text-[10px] font-black uppercase tracking-widest text-red-500 bg-red-100 hover:bg-red-200 px-3 py-1.5 rounded-full transition-colors"
                >
                    Retry
                </button>
            </div>
        );

        const WakeUpBanner = () => (
            <div className="bg-blue-50 border border-blue-100 rounded-2xl p-5 mb-6 flex items-center gap-4">
                <div className="w-4 h-4 border-2 border-blue-400 border-t-transparent rounded-full spin shrink-0"></div>
                <p className="text-sm font-bold text-blue-600">Waking up live server — this can take up to 30 seconds on first load…</p>
            </div>
        );

        // ─── Main App ─────────────────────────────────────────────────────────────

        function App() {
            const [showSplash,       setShowSplash]       = useState(true);
            const [showCalendar,     setShowCalendar]     = useState(false);
            const [activeTab,        setActiveTab]        = useState('Home');
            const [activeSport,      setActiveSport]      = useState('Football');
            const [favorites,        setFavorites]        = useState([]);
            const [matches,          setMatches]          = useState([]);
            const [loading,          setLoading]          = useState(true);
            const [serverWaking,     setServerWaking]     = useState(false);
            const [error,            setError]            = useState(null);
            const [selectedPrediction, setSelectedPrediction] = useState(null);
            const [loadingPrediction,  setLoadingPrediction]  = useState(false);
            const [predictionError,    setPredictionError]    = useState(null);
            const [comingSoonSport,  setComingSoonSport]  = useState(null);

            // ── Data fetch ──────────────────────────────────────────────────────
            const fetchData = useCallback(async () => {
                setLoading(true);
                setError(null);

                // Show "waking up" banner if the server takes more than 4 s
                const wakeTimer = setTimeout(() => setServerWaking(true), 4000);

                try {
                    const controller = new AbortController();
                    const timeoutId  = setTimeout(() => controller.abort(), 35000);

                    const res = await fetch(`${BACKEND_URL}/api/scores`, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    clearTimeout(wakeTimer);
                    setServerWaking(false);

                    if (!res.ok) throw new Error(`Server error ${res.status}`);

                    const data = await res.json();

                    if (data.livescore && data.livescore.league) {
                        const flattened = [];
                        const leagues = Array.isArray(data.livescore.league)
                            ? data.livescore.league
                            : [data.livescore.league];

                        leagues.forEach(league => {
                            if (!league.match) return;
                            const items = Array.isArray(league.match) ? league.match : [league.match];
                            items.forEach(m => flattened.push({
                                ...m,
                                leagueName: league.name,
                                country:    league.country,
                            }));
                        });

                        setMatches(flattened);
                    } else {
                        throw new Error("Unexpected response format");
                    }
                } catch (err) {
                    clearTimeout(wakeTimer);
                    setServerWaking(false);

                    if (err.name === 'AbortError') {
                        setError("Server is taking too long to respond. It may still be starting up — please retry in a moment.");
                    } else {
                        setError("Could not load live data. Check your connection or try again.");
                    }
                    console.error("Score sync failed:", err.message);
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                const splashTimer = setTimeout(() => setShowSplash(false), 3300);
                fetchData();
                const interval = setInterval(fetchData, 60000);
                return () => { clearTimeout(splashTimer); clearInterval(interval); };
            }, [fetchData]);

            // ── Prediction fetch ────────────────────────────────────────────────
            const handleFetchPrediction = useCallback(async (match) => {
                const fixtureId = getFixtureId(match);
                if (!fixtureId) {
                    setPredictionError("No fixture ID for this match — prediction unavailable.");
                    return;
                }
                setPredictionError(null);
                setLoadingPrediction(true);
                try {
                    const res = await fetch(`${BACKEND_URL}/api/get-predictions?fixture=${fixtureId}`);
                    if (!res.ok) throw new Error(`Server error ${res.status}`);
                    const data = await res.json();
                    const pred = data.response?.[0] || null;
                    if (!pred) throw new Error("No prediction data returned");
                    setSelectedPrediction(pred);
                } catch (err) {
                    setPredictionError("Prediction not available for this match.");
                    console.error("Prediction fetch failed:", err.message);
                } finally {
                    setLoadingPrediction(false);
                }
            }, []);

            const toggleFavorite = useCallback((id) => {
                if (!id) return;
                setFavorites(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);
            }, []);

            const handleSportClick = (sport) => {
                if (sport === 'Football') setActiveSport(sport);
                else setComingSoonSport(sport);
            };

            // ── Derived lists ───────────────────────────────────────────────────
            const liveMatches     = useMemo(() => matches.filter(m => getMatchCategory(m.status) === 'live').slice(0, 15),     [matches]);
            const pastMatches     = useMemo(() => matches.filter(m => getMatchCategory(m.status) === 'finished').slice(0, 15), [matches]);
            const upcomingMatches = useMemo(() => matches.filter(m => getMatchCategory(m.status) === 'upcoming').slice(0, 10), [matches]);
            const favoriteMatches = useMemo(() => matches.filter(m => favorites.includes(getFixtureId(m))),                   [matches, favorites]);
            const alertMatches    = useMemo(() => {
                return matches.filter(m => {
                    const min = parseInt(m.status);
                    return !isNaN(min) && min >= 75 && min < 120;
                }).slice(0, 10);
            }, [matches]);

            // ── Calendar days ───────────────────────────────────────────────────
            const getCalendarDays = () => {
                const days = [];
                const today = new Date();
                const startOfWeek = today.getDate() - today.getDay() + 1;
                for (let i = 0; i < 5; i++) {
                    const d = new Date(today.getFullYear(), today.getMonth(), startOfWeek + i);
                    days.push({
                        name:   d.toLocaleDateString('en-US', { weekday: 'short' }),
                        date:   d.getDate(),
                        full:   d.toDateString(),
                        active: d.toDateString() === today.toDateString(),
                    });
                }
                return days;
            };

            const sports = [
                { name: 'Football',   icon: '⚽' },
                { name: 'Basketball', icon: '🏀' },
                { name: 'Tennis',     icon: '🎾' },
                { name: 'Hockey',     icon: '🏒' },
                { name: 'Baseball',   icon: '⚾' },
            ];

            const todayLabel = new Date().toLocaleDateString('en-US', {
                weekday: 'long', month: 'long', day: 'numeric',
            }).toUpperCase();

            // ── Shared row renderer ─────────────────────────────────────────────
            const renderRow = (m, extra = {}) => (
                <MatchRow
                    key={getFixtureId(m) || `${m.home?.name}-${m.away?.name}`}
                    match={m}
                    onSelect={() => handleFetchPrediction(m)}
                    onToggleFav={toggleFavorite}
                    isFav={favorites.includes(getFixtureId(m))}
                    {...extra}
                />
            );

            // ── Section divider ─────────────────────────────────────────────────
            const SectionDivider = ({ label, color = "slate" }) => {
                const colors = {
                    red:   { bar: 'bg-red-100',   text: 'text-red-500',   pill: 'bg-red-50 border-red-100' },
                    slate: { bar: 'bg-slate-100', text: 'text-slate-400', pill: 'bg-slate-50 border-slate-100' },
                    blue:  { bar: 'bg-blue-100',  text: 'text-blue-500',  pill: 'bg-blue-50 border-blue-100' },
                };
                const c = colors[color] || colors.slate;
                return (
                    <div className="flex items-center gap-3 mb-6">
                        <div className={`h-1 flex-1 ${c.bar} rounded-full`}></div>
                        <h2 className={`text-[10px] font-black ${c.text} uppercase tracking-[0.4em] whitespace-nowrap ${c.pill} px-4 py-1.5 rounded-full border`}>{label}</h2>
                        <div className={`h-1 flex-1 ${c.bar} rounded-full`}></div>
                    </div>
                );
            };

            // ── Render ──────────────────────────────────────────────────────────
            return (
                <div className="min-h-screen pb-32">

                    {/* Splash screen */}
                    {showSplash && (
                        <div className="fixed inset-0 z-[300] bg-[#F8F9FA] flex flex-col items-center justify-center animate-fade-out px-6">
                            <div className="relative flex flex-col items-center text-center">
                                <svg className="absolute -top-12 -left-12 -right-12 -bottom-12 w-[140%] h-[140%] opacity-20" viewBox="0 0 200 200">
                                    <path d="M 100, 100 m -75, 0 a 75,75 0 1,0 150,0 a 75,75 0 1,0 -150,0" fill="none" stroke="#000" strokeWidth="1.5" className="animate-draw" />
                                </svg>
                                <div className="animate-pop flex flex-col items-center">
                                    <div className="w-24 h-24 bg-white rounded-[2rem] flex items-center justify-center shadow-2xl mb-8 overflow-hidden p-2 border border-slate-50">
                                        <MagicLogo size={80} />
                                    </div>
                                    <h1 className="text-5xl font-black text-slate-900 tracking-tighter leading-none mb-2">Magic Analysis</h1>
                                    <p className="text-lg text-slate-400 font-bold tracking-widest uppercase">Live Intelligence</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-white border-b sticky top-0 z-50 px-6 h-20 flex items-center justify-between shadow-sm">
                        <div onClick={() => setShowCalendar(true)} className="w-10 h-10 flex items-center justify-center cursor-pointer hover:bg-gray-50 rounded-xl transition-all">
                            <LucideIcon name="calendar" size={24} className="text-slate-900" />
                        </div>
                        <div className="flex-1 flex justify-center items-center gap-3">
                            <div className="w-10 h-10 bg-white rounded-xl shadow-lg flex items-center justify-center border p-1">
                                <MagicLogo size={36} />
                            </div>
                            <span className="font-black text-xl uppercase tracking-tight text-slate-900">Magic Analysis</span>
                        </div>
                        <button
                            onClick={fetchData}
                            className="w-10 h-10 flex items-center justify-center cursor-pointer text-gray-400 hover:text-slate-900 hover:bg-gray-50 rounded-xl transition-all"
                            title="Refresh live data"
                        >
                            <LucideIcon name="refresh-cw" size={20} />
                        </button>
                    </header>

                    {/* Sport tabs */}
                    <div className="bg-white border-b px-4 py-4 flex gap-4 overflow-x-auto no-scrollbar justify-start md:justify-center">
                        {sports.map((s) => (
                            <button
                                key={s.name}
                                onClick={() => handleSportClick(s.name)}
                                className={`flex items-center gap-2 px-6 py-3 rounded-full text-sm font-bold whitespace-nowrap border transition-all ${activeSport === s.name ? 'bg-slate-900 text-white border-slate-900 scale-105 shadow-blue-200 shadow-lg tab-active' : 'bg-white text-slate-500 border-gray-100 hover:bg-gray-50'}`}
                            >
                                <span className="text-lg">{s.icon}</span> {s.name}
                            </button>
                        ))}
                    </div>

                    {/* Main content */}
                    <main className="max-w-4xl mx-auto p-4 md:p-8">

                        {/* HOME TAB */}
                        {activeTab === 'Home' && (
                            <section className="animate-slide-in text-left">
                                <div className="mb-8">
                                    <h1 className="text-3xl font-black text-slate-900 mb-1 leading-tight tracking-tight">Predictions</h1>
                                    <p className="text-[11px] font-black text-slate-400 uppercase tracking-widest">{todayLabel}</p>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
                                    <StatBox label="Live"    count={liveMatches.length}     color="text-green-500"  bg="bg-green-50/50"  borderColor="border-green-100" />
                                    <StatBox label="History" count={pastMatches.length}     color="text-slate-600"  bg="bg-slate-100/50" borderColor="border-slate-200" />
                                    <StatBox label="Soon"    count={upcomingMatches.length} color="text-blue-500"   bg="bg-blue-50/50"   borderColor="border-blue-100" />
                                    <StatBox label="Alerts"  count={alertMatches.length}    color="text-orange-500" bg="bg-orange-50/50" borderColor="border-orange-100" />
                                </div>

                                {/* Wake-up / error banners */}
                                {serverWaking && <WakeUpBanner />}
                                {error && !loading && <ErrorBanner message={error} onRetry={fetchData} />}

                                {/* Prediction error (inline) */}
                                {predictionError && (
                                    <div className="bg-amber-50 border border-amber-100 rounded-2xl p-4 mb-4 flex items-center gap-3">
                                        <LucideIcon name="alert-triangle" size={18} className="text-amber-500 shrink-0" />
                                        <p className="text-sm font-bold text-amber-700 flex-1">{predictionError}</p>
                                        <button onClick={() => setPredictionError(null)} className="text-amber-400 hover:text-amber-600 text-lg leading-none">✕</button>
                                    </div>
                                )}

                                {/* Live matches */}
                                <SectionDivider label="Live Predictions" color="red" />
                                {loading ? (
                                    <div className="py-12 text-center">
                                        <div className="w-8 h-8 border-2 border-slate-200 border-t-blue-500 rounded-full spin mx-auto mb-3"></div>
                                        <p className="text-[10px] font-black text-slate-300 uppercase tracking-widest">Loading live data</p>
                                    </div>
                                ) : liveMatches.length > 0 ? (
                                    liveMatches.map(m => renderRow(m))
                                ) : (
                                    <EmptyState icon="activity" title="No live matches right now" sub="Live matches will appear here automatically." />
                                )}

                                {/* Past matches */}
                                <div className="mt-10">
                                    <SectionDivider label="Past Predictions" color="slate" />
                                    {pastMatches.length > 0 ? (
                                        pastMatches.map(m => renderRow(m))
                                    ) : (
                                        !loading && <EmptyState icon="clock" title="No finished matches yet" />
                                    )}
                                </div>

                                {/* Upcoming matches */}
                                {upcomingMatches.length > 0 && (
                                    <div className="mt-10">
                                        <SectionDivider label="Upcoming" color="blue" />
                                        {upcomingMatches.map(m => renderRow(m))}
                                    </div>
                                )}

                                <SocialFooter />
                            </section>
                        )}

                        {/* ALERTS TAB */}
                        {activeTab === 'Alerts' && (
                            <section className="animate-slide-in text-left">
                                <h1 className="text-3xl font-black mb-1 tracking-tight text-slate-900 leading-none">Notifications</h1>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-8">
                                    Matches in the 75+ minute window — sequential drop (3 s interval)
                                </p>
                                {alertMatches.length > 0 ? (
                                    alertMatches.map((m, i) => renderRow(m, { isNotification: true, index: i }))
                                ) : (
                                    <EmptyState icon="bell-off" title="No match alerts in the pipe" sub="Matches entering the 75+ min window will appear here." />
                                )}
                                <SocialFooter />
                            </section>
                        )}

                        {/* FAVOURITES TAB */}
                        {activeTab === 'Favs' && (
                            <section className="animate-slide-in text-left">
                                <h1 className="text-3xl font-black mb-1 tracking-tight text-slate-900 leading-none">Saved Matches</h1>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-8">Personalized intelligence tracking</p>
                                {favoriteMatches.length > 0 ? (
                                    favoriteMatches.map(m => renderRow(m))
                                ) : (
                                    <div className="text-center py-20 px-6">
                                        <LucideIcon name="heart" size={60} className="text-slate-100 mx-auto mb-4" />
                                        <h1 className="text-xl font-bold text-slate-900">List is Empty</h1>
                                        <p className="text-sm text-slate-400 mt-2">Tap the heart on any match to save it here.</p>
                                    </div>
                                )}
                                <SocialFooter />
                            </section>
                        )}

                        {/* MORE TAB */}
                        {activeTab === 'More' && (
                            <section className="animate-slide-in text-left">
                                <h1 className="text-3xl font-black mb-10 tracking-tight text-slate-900 uppercase">Tools</h1>
                                <div className="space-y-4">
                                    <a href="https://docs.google.com/document/d/1OaaYhaQi3FZzog6YLIoojh3CnX3aN0lrizXyQ5N9Dkw/edit?usp=sharing" target="_blank" rel="noopener noreferrer"
                                        className="bg-white p-6 rounded-[1.5rem] border border-gray-100 flex justify-between items-center font-bold text-slate-700 shadow-sm hover:shadow-md transition-all group">
                                        About Us <LucideIcon name="chevron-right" size={18} className="text-slate-300 group-hover:text-slate-900" />
                                    </a>
                                    <a href="https://docs.google.com/document/d/1wO92_LRf7q1vS90SdmHgArGITPkimnMa7g_U_VHFZo4/edit?usp=sharing" target="_blank" rel="noopener noreferrer"
                                        className="bg-white p-6 rounded-[1.5rem] border border-gray-100 flex justify-between items-center font-bold text-slate-700 shadow-sm hover:shadow-md transition-all group">
                                        Terms of Use <LucideIcon name="chevron-right" size={18} className="text-slate-300 group-hover:text-slate-900" />
                                    </a>
                                    <a href="https://docs.google.com/document/d/1qrcuBqJ3RoSTTdjtyHJXidpVNODILbHW5cLx4wlAe6Y/edit?usp=sharing" target="_blank" rel="noopener noreferrer"
                                        className="bg-white p-6 rounded-[1.5rem] border border-gray-100 flex justify-between items-center font-bold text-slate-700 shadow-sm hover:shadow-md transition-all group">
                                        Privacy Policy <LucideIcon name="chevron-right" size={18} className="text-slate-300 group-hover:text-slate-900" />
                                    </a>
                                </div>
                                <SocialFooter />
                            </section>
                        )}
                    </main>

                    {/* Calendar modal */}
                    {showCalendar && (
                        <div className="fixed inset-0 z-[160] bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] w-full max-w-sm p-10 text-center animate-slide-in relative shadow-2xl">
                                <button onClick={() => setShowCalendar(false)} className="absolute top-6 right-6 text-slate-300 hover:text-slate-900 font-bold text-xl transition-colors">✕</button>
                                <LucideIcon name="calendar" size={48} className="mx-auto mb-6 text-blue-600" />
                                <h3 className="text-2xl font-black mb-2 uppercase tracking-tighter">Fixture Calendar</h3>
                                <p className="text-[10px] text-slate-400 mb-8 font-black uppercase tracking-widest">Mon — Fri Schedule Only</p>
                                <div className="grid grid-cols-5 gap-3">
                                    {getCalendarDays().map(d => (
                                        <div key={d.full} className={`p-4 rounded-2xl border text-center transition-all ${d.active ? 'bg-slate-900 text-white shadow-xl border-black scale-105' : 'bg-white text-slate-400 border-gray-100 hover:border-blue-300'}`}>
                                            <span className="text-[10px] font-black block uppercase mb-1">{d.name}</span>
                                            <span className="text-sm font-black">{d.date}</span>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setShowCalendar(false)} className="mt-10 w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-xs uppercase tracking-widest shadow-xl">Confirm</button>
                            </div>
                        </div>
                    )}

                    {/* Coming soon modal */}
                    {comingSoonSport && (
                        <div className="fixed inset-0 z-[200] bg-slate-900/90 backdrop-blur-xl flex items-center justify-center p-4">
                            <div className="bg-white rounded-[3rem] w-full max-w-sm p-10 text-center animate-slide-in border border-white/20 shadow-2xl">
                                <div className="w-28 h-28 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-8 text-blue-600 shadow-inner">
                                    <VIPGateIcon size={80} className="text-blue-600" />
                                </div>
                                <h2 className="text-2xl font-black text-slate-900 mb-4 uppercase tracking-tighter">Coming Soon</h2>
                                <p className="text-sm text-slate-500 leading-relaxed mb-8 font-medium italic px-4">
                                    We're working hard to bring you live <span className="font-bold text-blue-600 text-lg uppercase">{comingSoonSport}</span> scores and predictions. Stay tuned!
                                </p>
                                <button onClick={() => setComingSoonSport(null)} className="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-xs uppercase shadow-xl">Close</button>
                            </div>
                        </div>
                    )}

                    {/* Prediction modal */}
                    {selectedPrediction && (
                        <div className="fixed inset-0 z-[100] bg-slate-900/80 flex items-center justify-center p-4 backdrop-blur-md overflow-y-auto">
                            <div className="py-8 w-full flex justify-center">
                                <PredictionView data={selectedPrediction} onClose={() => setSelectedPrediction(null)} />
                            </div>
                        </div>
                    )}

                    {/* Prediction loading overlay */}
                    {loadingPrediction && (
                        <div className="fixed inset-0 z-[110] bg-white/40 backdrop-blur-[6px] flex items-center justify-center">
                            <div className="bg-white p-12 rounded-[3rem] shadow-2xl border border-white flex flex-col items-center gap-5 animate-pop">
                                <div className="relative w-16 h-16 flex items-center justify-center">
                                    <div className="w-16 h-16 border-4 border-slate-100 border-t-blue-500 rounded-full spin"></div>
                                    <LucideIcon name="zap" size={22} className="absolute text-orange-500" fill="currentColor" />
                                </div>
                                <span className="font-black text-[11px] uppercase tracking-[0.3em] text-slate-800">Processing intelligence</span>
                            </div>
                        </div>
                    )}

                    {/* Bottom nav */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t h-24 flex items-center justify-around px-6 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.04)]">
                        <div onClick={() => setActiveTab('Home')}><NavIcon  icon={<MagicLogo size={24} />}           label="Home"   active={activeTab === 'Home'} /></div>
                        <div onClick={() => setActiveTab('Alerts')}><NavIcon icon={<LucideIcon name="bell" size={22} />} label="Alerts" active={activeTab === 'Alerts'} /></div>
                        <div onClick={() => setActiveTab('Favs')}><NavIcon  icon={<LucideIcon name="heart" size={22} />} label="Favs"   active={activeTab === 'Favs'} /></div>
                        <div onClick={() => setActiveTab('More')}><NavIcon  icon={<LucideIcon name="menu" size={22} />} label="More"   active={activeTab === 'More'} /></div>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
