<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magicbetingtips – Live Scores & Predictions</title>
  <meta name="description" content="Daily AI-powered football predictions and betting tips from Magicbetingtips." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0c0c14;
      --surface: #13131f;
      --border:  #1e1e30;
      --green:   #25d366;
      --text:    #e8e8f0;
      --muted:   #6b6b80;
      --header-h: 52px;

      /* ── Crop controls — tweak these to fine-tune the visible window ── */
      --crop-top:    80px;   /* pixels of site header to hide  */
      --crop-left:   240px;  /* pixels of left sidebar to hide */
      --crop-right:  260px;  /* pixels of right sidebar to hide */
      --crop-bottom: 60px;   /* pixels of site footer to hide  */
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--green);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .logo-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .logo-name span { color: var(--green); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--green);
      background: rgba(37,211,102,0.12);
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid rgba(37,211,102,0.25);
    }

    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff4444;
      animation: pulse 1.4s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .4; transform: scale(.7); }
    }

    .open-btn {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: color .15s, border-color .15s;
    }
    .open-btn:hover { color: var(--text); border-color: var(--muted); }

    /* ── Viewport that clips the iframe ── */
    .viewport {
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0; bottom: 0;
      overflow: hidden;         /* this does the cropping */
      background: var(--bg);
    }

    /*
      The iframe is positioned so that:
        - its top is shifted UP by --crop-top  (hides the site header)
        - its left is shifted LEFT by --crop-left (hides left sidebar)
        - its width is expanded to also cover --crop-right (hides right sidebar)
        - its height is expanded to also cover --crop-bottom (hides footer)
      Combined with overflow:hidden on .viewport, only the middle shows.
    */
    iframe {
      position: absolute;
      top:    calc(-1 * var(--crop-top));
      left:   calc(-1 * var(--crop-left));
      width:  calc(100% + var(--crop-left) + var(--crop-right));
      height: calc(100% + var(--crop-top) + var(--crop-bottom));
      border: none;
      background: #fff;
    }

    /* ── Blocked fallback ── */
    .blocked {
      display: none;
      position: absolute;
      inset: 0;
      background: var(--bg);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 24px;
    }
    .blocked.show { display: flex; }

    .blocked-icon { font-size: 48px; }

    .blocked h2 { font-size: 20px; font-weight: 700; }

    .blocked p {
      font-size: 14px;
      color: var(--muted);
      max-width: 340px;
      line-height: 1.6;
    }

    .blocked a {
      display: inline-block;
      margin-top: 4px;
      padding: 10px 24px;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity .15s;
    }
    .blocked a:hover { opacity: .85; }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="#">
      <div class="logo-icon">⚽</div>
      <div class="logo-name">Magic<span>Beting</span>Tips</div>
    </a>
    <div class="header-right">
      <span class="live-dot"></span>
      <span class="tag">Live Scores</span>
      <a class="open-btn" href="https://www.pitchpredictions.com" target="_blank" rel="noopener">
        Full Site ↗
      </a>
    </div>
  </header>

  <div class="viewport">
    <iframe
      id="predFrame"
      src="https://www.pitchpredictions.com"
      title="Live Scores – Pitch Predictions"
      loading="eager"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
    ></iframe>

    <div class="blocked" id="blockedMsg">
      <div class="blocked-icon">🔒</div>
      <h2>Embed Restricted</h2>
      <p>
        <strong>pitchpredictions.com</strong> has blocked embedding.
        Tap below to view live scores directly.
      </p>
      <a href="https://www.pitchpredictions.com" target="_blank" rel="noopener">
        View Live Scores ↗
      </a>
    </div>
  </div>

  <script>
    const frame   = document.getElementById('predFrame');
    const blocked = document.getElementById('blockedMsg');

    frame.addEventListener('error', () => blocked.classList.add('show'));

    // Fallback: if 9 s pass and frame is still blank, show the blocked overlay
    setTimeout(() => {
      try {
        if (frame.contentWindow.location.href === 'about:blank') {
          blocked.classList.add('show');
        }
      } catch (_) { /* cross-origin = loaded fine */ }
    }, 9000);
  </script>

</body>
</html>
