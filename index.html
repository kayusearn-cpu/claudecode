<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magicbetingtips – Live Scores & Predictions</title>
  <meta name="description" content="Daily AI-powered football predictions and betting tips from Magicbetingtips." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0c0c14;
      --surface: #13131f;
      --border:  #1e1e30;
      --green:   #25d366;
      --text:    #e8e8f0;
      --muted:   #6b6b80;
      --header-h: 52px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: var(--green);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .logo-name { font-size: 17px; font-weight: 700; color: var(--text); }
    .logo-name span { color: var(--green); }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff4444;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .4; transform: scale(.7); }
    }

    .tag {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--green);
      background: rgba(37,211,102,0.12);
      padding: 3px 9px; border-radius: 20px;
      border: 1px solid rgba(37,211,102,0.25);
    }

    .open-btn {
      font-size: 12px; font-weight: 600;
      color: var(--muted); text-decoration: none;
      padding: 5px 11px;
      border: 1px solid var(--border); border-radius: 6px;
      transition: color .15s, border-color .15s;
    }
    .open-btn:hover { color: var(--text); border-color: var(--muted); }

    /* The clip window — overflow:hidden is what does the actual cropping */
    #viewport {
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0; bottom: 0;
      overflow: hidden;
      background: var(--bg);
    }

    /* iframe size & position is set entirely by JS */
    #predFrame {
      position: absolute;
      border: none;
      background: #fff;
    }

    /* Fallback if site blocks embedding */
    .blocked {
      display: none;
      position: absolute; inset: 0;
      background: var(--bg);
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; text-align: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
    }
    .blocked.show { display: flex; }
    .blocked-icon { font-size: 48px; }
    .blocked h2 { font-size: 20px; font-weight: 700; }
    .blocked p { font-size: 14px; color: var(--muted); max-width: 340px; line-height: 1.6; }
    .blocked a {
      display: inline-block; margin-top: 4px;
      padding: 10px 24px; background: var(--green);
      color: #000; font-weight: 700; font-size: 14px;
      border-radius: 8px; text-decoration: none;
    }
    .blocked a:hover { opacity: .85; }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="#">
      <div class="logo-icon">⚽</div>
      <div class="logo-name">Magic<span>Beting</span>Tips</div>
    </a>
    <div class="header-right">
      <span class="live-dot"></span>
      <span class="tag">Live Scores</span>
      <a class="open-btn" href="https://www.pitchpredictions.com" target="_blank" rel="noopener">
        Full Site ↗
      </a>
    </div>
  </header>

  <div id="viewport">
    <iframe
      id="predFrame"
      src="https://www.pitchpredictions.com"
      title="Live Football Predictions"
      loading="eager"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
    ></iframe>

    <div class="blocked" id="blockedMsg">
      <div class="blocked-icon">🔒</div>
      <h2>Embed Restricted</h2>
      <p>
        <strong>pitchpredictions.com</strong> has blocked embedding.
        Tap below to open predictions directly.
      </p>
      <a href="https://www.pitchpredictions.com" target="_blank" rel="noopener">
        View Predictions ↗
      </a>
    </div>
  </div>

  <script>
    /*
     * CROP SETTINGS (in desktop pixels at SITE_WIDTH)
     * ─────────────────────────────────────────────────
     * SITE_WIDTH  – width we force the iframe to render at (desktop layout)
     * CROP_LEFT   – left sidebar (leagues / nav links)
     * CROP_RIGHT  – right sidebar (calendar + Game of the Day)
     * CROP_TOP    – pitchpredictions top nav bar
     * CROP_BOTTOM – bet9ja / footer ad strip
     *
     * To tweak: open DevTools → inspect pitchpredictions.com at 1200px
     * wide and measure each section's pixel width/height, then update
     * the numbers below.
     */
    const SITE_WIDTH  = 1200;
    const CROP_LEFT   = 185;
    const CROP_RIGHT  = 230;
    const CROP_TOP    = 55;
    const CROP_BOTTOM = 90;

    const frame   = document.getElementById('predFrame');
    const vp      = document.getElementById('viewport');
    const blocked = document.getElementById('blockedMsg');

    function layout() {
      const vpW = vp.offsetWidth;
      const vpH = vp.offsetHeight;

      /*
       * The visible content column width at desktop (1200px):
       *   contentW = SITE_WIDTH - CROP_LEFT - CROP_RIGHT
       *
       * Scale the iframe so that content column fills the viewport width:
       *   scale = vpW / contentW
       *
       * The iframe element top-left is placed at:
       *   left = -(CROP_LEFT * scale)
       *   top  = -(CROP_TOP  * scale)
       *
       * This makes the point (CROP_LEFT, CROP_TOP) in site space land
       * exactly at (0, 0) in the viewport, which is what we want.
       */
      const contentW = SITE_WIDTH - CROP_LEFT - CROP_RIGHT;
      const scale    = vpW / contentW;

      frame.style.width           = SITE_WIDTH + 'px';
      frame.style.height          = Math.max(Math.ceil(vpH / scale) + CROP_TOP + CROP_BOTTOM, 900) + 'px';
      frame.style.left            = -(CROP_LEFT * scale) + 'px';
      frame.style.top             = -(CROP_TOP  * scale) + 'px';
      frame.style.transformOrigin = '0 0';
      frame.style.transform       = 'scale(' + scale + ')';
    }

    layout();
    window.addEventListener('resize', layout);

    // Detect if embedding is blocked
    frame.addEventListener('error', () => blocked.classList.add('show'));

    setTimeout(() => {
      try {
        if (frame.contentWindow.location.href === 'about:blank') {
          blocked.classList.add('show');
        }
      } catch (_) { /* cross-origin means the iframe loaded fine */ }
    }, 9000);
  </script>

</body>
</html>
