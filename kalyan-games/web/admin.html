<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalyan Games — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030712; --panel:#080b14; --card:#171b26; --card2:#10141e; --field:#1b1f2b;
  --line:#232838; --line2:#2c3242; --ink:#f4f5f7; --sub:#9aa0ad; --muted:#6b7180;
  --grad:linear-gradient(100deg,#682DFF 0%,#A855F7 50%,#C027FF 100%);
  --violet:#a855f7; --red:#f5484b; --green:#00c45a; --yellow:#f5c542; --blue:#4aa3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a2f3d;border-radius:8px}
[hidden]{display:none!important}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(700px 500px at 20% 10%,rgba(104,45,255,.10),transparent 55%),
  radial-gradient(700px 500px at 90% 90%,rgba(192,39,255,.08),transparent 55%),var(--bg)}
.login-card{width:100%;max-width:400px;background:var(--card2);border:1px solid var(--line);border-radius:22px;padding:34px 28px}
.login-card .logo{display:flex;justify-content:center;margin-bottom:20px}
.login-card h1{font-size:22px;font-weight:600;text-align:center}
.login-card p{color:var(--sub);text-align:center;font-size:13px;margin:6px 0 24px}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:7px}
.fld input{width:100%;height:48px;border:1px solid var(--line2);border-radius:12px;background:var(--field);padding:0 16px;font-size:14px}
.fld input:focus{outline:none;border-color:var(--violet)}
.btn{width:100%;height:50px;border-radius:12px;background:var(--grad);color:#fff;font-weight:600;font-size:15px;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.99)}
.btn.sm{height:40px;font-size:13px;width:auto;padding:0 20px}
.btn.ghost{background:#2b2f3b;color:#e6e8ee}
.err{color:var(--red);font-size:12.5px;margin-top:10px;text-align:center;min-height:16px}

/* ---------- SHELL ---------- */
.shell{display:flex;min-height:100vh}
.side{width:252px;flex:0 0 252px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
.side .brand{display:flex;justify-content:center;padding:26px 0 18px}
.side .divider{height:1px;background:var(--line);margin:0 20px}
.side .grp{font-size:10.5px;letter-spacing:.14em;color:#5a6070;font-weight:600;padding:20px 22px 8px}
.nav{display:flex;flex-direction:column;padding:0 12px;gap:2px}
.nav a,.nav button.item{display:flex;align-items:center;gap:13px;height:44px;padding:0 12px;border-radius:11px;color:#9ba1af;font-size:13.5px;font-weight:500;width:100%;text-align:left;transition:background .13s,color .13s}
.nav a:hover,.nav button.item:hover{background:#11151f;color:#e6e8ee}
.nav a svg,.nav button.item svg{width:19px;height:19px;flex:0 0 19px;color:#7b8290}
.nav a.active{background:linear-gradient(100deg,rgba(104,45,255,.22),rgba(192,39,255,.14));color:#fff;border:1px solid rgba(139,92,246,.5)}
.nav a.active svg{color:#b98bff}
.nav .caret{margin-left:auto;width:14px;height:14px;transition:transform .18s}
.nav .grp-open .caret{transform:rotate(180deg)}
.subnav{display:none;flex-direction:column;gap:1px;padding:2px 0 4px 22px;position:relative}
.subnav.open{display:flex}
.subnav::before{content:"";position:absolute;left:22px;top:0;bottom:8px;width:1px;background:var(--line2)}
.subnav a{height:38px;font-size:12.5px;color:#8990a0;padding-left:16px}
.subnav a.active{background:linear-gradient(100deg,rgba(104,45,255,.22),rgba(192,39,255,.14));color:#fff;border:1px solid rgba(139,92,246,.45)}
.side .logout{margin:auto 12px 20px;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;color:var(--red);font-weight:600;font-size:13.5px}
.side .logout svg{width:19px;height:19px}

.main{flex:1;min-width:0;padding:26px 30px 60px}
.head{margin-bottom:26px}
.head h1{font-size:32px;font-weight:600;letter-spacing:-.5px}
.head .date{color:var(--sub);font-size:14px;margin-top:2px}

.panel{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:22px}
.panel > h2{font-size:20px;font-weight:600;margin-bottom:18px}
.sub{color:var(--sub);font-size:13px}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stat .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin-bottom:16px}
.stat .val{font-size:28px;font-weight:700;letter-spacing:-.5px}
.stat .lbl{color:var(--sub);font-size:13px;margin-top:3px}

/* game type cards */
.gt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.gt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.gt .gh{display:flex;align-items:center;gap:12px;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:12px}
.gt .gh .gi{width:38px;height:38px;border-radius:50%;background:#241a3a;display:grid;place-items:center;font-size:18px}
.gt .gh b{font-size:17px;font-weight:600}
.gt .row{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;color:var(--sub)}
.gt .row b{color:var(--ink);font-weight:600}

/* generic table */
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;min-width:560px}
table.tbl th{background:#121622;color:#cfd3db;font-size:12.5px;font-weight:500;text-align:left;padding:14px 16px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.tbl td{padding:14px 16px;font-size:13px;color:#d3d6de;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:#0e131d}
.searchbar{display:flex;align-items:center;gap:10px;height:46px;border:1px solid var(--line2);border-radius:14px;padding:0 16px;background:var(--card2);margin-bottom:18px;max-width:340px}
.searchbar input{flex:1;border:0;outline:none;background:none;font-size:13.5px}
.searchbar svg{width:16px;height:16px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:14px;margin-top:16px;color:var(--sub);font-size:12.5px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:14px;font-size:11.5px;border:1px solid}
.pill.on{color:var(--green);border-color:var(--green)} .pill.off{color:var(--red);border-color:var(--red)} .pill.pend{color:var(--yellow);border-color:var(--yellow)}

.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 24px;color:var(--sub)}
.placeholder .pi{width:64px;height:64px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:16px;color:var(--violet)}
.placeholder h3{color:var(--ink);font-size:18px;font-weight:600;margin-bottom:8px}
.loading{color:var(--muted);font-size:13px;padding:24px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:#1b1f2b;border:1px solid var(--line2);color:#fff;font-size:13px;padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:860px){
  .side{position:fixed;left:0;top:0;z-index:100;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  .main{padding:20px 16px 60px}
  .head h1{font-size:26px}
  .mtoggle{display:inline-grid!important}
}
.mtoggle{display:none;place-items:center;width:40px;height:40px;border:1px solid var(--line2);border-radius:11px;margin-bottom:16px}
</style></head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login">
  <div class="login-card">
    <div class="logo">
      <svg width="70" height="46" viewBox="0 0 61 40"><defs><linearGradient id="lg" x1="0" y1="20" x2="61" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#682DFF"/><stop offset="1" stop-color="#C027FF"/></linearGradient></defs><path fill="url(#lg)" d="M12.26 40c-1.69 0-3.28-.32-4.76-.96a12.3 12.3 0 0 1-3.9-2.6A12.2 12.2 0 0 1 .97 32.58 12.03 12.03 0 0 1 0 27.85c0-1.4.24-2.76.73-4.09.49-1.33 1.18-2.53 2.08-3.6l.07-.17-.07-.11a12.3 12.3 0 0 1-2.08-3.6A12.03 12.03 0 0 1 0 12.17C0 10.48.32 8.9.97 7.43a12.2 12.2 0 0 1 2.63-3.85A12.3 12.3 0 0 1 7.5.97C8.99.33 10.58 0 12.26 0h14.97v8.6H12.26c-1 0-1.85.35-2.56 1.04a3.5 3.5 0 0 0-1.06 2.54c0 .47.1.93.29 1.36.19.44.45.82.77 1.14.32.32.7.57 1.13.75.44.18.92.27 1.43.27h14.97v8.6H12.26c-.51 0-.99.09-1.43.27-.44.19-.81.44-1.13.77-.32.32-.58.7-.77 1.13a3.6 3.6 0 0 0-.29 1.43c0 .49.1.95.29 1.39.19.43.45.81.77 1.14.32.31.7.57 1.13.75.44.19.92.29 1.43.29h14.97V40H12.26Zm36.47-40c1.69 0 3.28.32 4.77.96a12.3 12.3 0 0 1 3.9 2.6 12.2 12.2 0 0 1 2.63 3.86c.64 1.47.96 3.05.96 4.73 0 1.4-.24 2.76-.73 4.09a12.3 12.3 0 0 1-2.08 3.6l-.08.17.08.11c.9 1.07 1.59 2.27 2.08 3.6.49 1.33.73 2.7.73 4.09 0 1.7-.32 3.28-.96 4.75a12.2 12.2 0 0 1-2.63 3.85 12.3 12.3 0 0 1-3.9 2.6c-1.49.64-3.08.97-4.77.97H33.77v-8.6h14.96c1 0 1.85-.35 2.56-1.04a3.5 3.5 0 0 0 1.06-2.54c0-.47-.1-.93-.29-1.36a3.65 3.65 0 0 0-.77-1.14c-.32-.32-.7-.57-1.13-.75a3.65 3.65 0 0 0-1.43-.27H33.77V15.7h14.96c.51 0 .99-.09 1.43-.28.44-.19.81-.44 1.13-.77.32-.32.58-.7.77-1.13.19-.43.29-.89.29-1.38 0-.49-.1-.95-.29-1.39a3.63 3.63 0 0 0-.77-1.13 3.55 3.55 0 0 0-1.13-.75 3.65 3.65 0 0 0-1.43-.27H33.77V0h14.96Z"/></svg>
    </div>
    <h1>Admin Panel</h1>
    <p>Sign in to manage Kalyan Games</p>
    <div class="fld"><label>Username</label><input id="lg-user" type="text" placeholder="Admin username" autocomplete="username"></div>
    <div class="fld"><label>Password</label><input id="lg-pass" type="password" placeholder="Password" autocomplete="current-password"></div>
    <div class="fld" id="lg-totp-wrap" hidden><label>Google Authenticator code</label><input id="lg-totp" type="text" inputmode="numeric" placeholder="6-digit code"></div>
    <button class="btn" onclick="doLogin()">Sign In</button>
    <div class="err" id="lg-err"></div>
  </div>
</div>

<!-- SHELL -->
<div class="shell" id="shell" hidden>
  <aside class="side" id="side">
    <div class="brand">
      <svg width="54" height="36" viewBox="0 0 61 40"><path fill="url(#lg)" d="M12.26 40c-1.69 0-3.28-.32-4.76-.96a12.3 12.3 0 0 1-3.9-2.6A12.2 12.2 0 0 1 .97 32.58 12.03 12.03 0 0 1 0 27.85c0-1.4.24-2.76.73-4.09.49-1.33 1.18-2.53 2.08-3.6l.07-.17-.07-.11a12.3 12.3 0 0 1-2.08-3.6A12.03 12.03 0 0 1 0 12.17C0 10.48.32 8.9.97 7.43a12.2 12.2 0 0 1 2.63-3.85A12.3 12.3 0 0 1 7.5.97C8.99.33 10.58 0 12.26 0h14.97v8.6H12.26c-1 0-1.85.35-2.56 1.04a3.5 3.5 0 0 0-1.06 2.54c0 .47.1.93.29 1.36.19.44.45.82.77 1.14.32.32.7.57 1.13.75.44.18.92.27 1.43.27h14.97v8.6H12.26c-.51 0-.99.09-1.43.27-.44.19-.81.44-1.13.77-.32.32-.58.7-.77 1.13a3.6 3.6 0 0 0-.29 1.43c0 .49.1.95.29 1.39.19.43.45.81.77 1.14.32.31.7.57 1.13.75.44.19.92.29 1.43.29h14.97V40H12.26Zm36.47-40c1.69 0 3.28.32 4.77.96a12.3 12.3 0 0 1 3.9 2.6 12.2 12.2 0 0 1 2.63 3.86c.64 1.47.96 3.05.96 4.73 0 1.4-.24 2.76-.73 4.09a12.3 12.3 0 0 1-2.08 3.6l-.08.17.08.11c.9 1.07 1.59 2.27 2.08 3.6.49 1.33.73 2.7.73 4.09 0 1.7-.32 3.28-.96 4.75a12.2 12.2 0 0 1-2.63 3.85 12.3 12.3 0 0 1-3.9 2.6c-1.49.64-3.08.97-4.77.97H33.77v-8.6h14.96c1 0 1.85-.35 2.56-1.04a3.5 3.5 0 0 0 1.06-2.54c0-.47-.1-.93-.29-1.36a3.65 3.65 0 0 0-.77-1.14c-.32-.32-.7-.57-1.13-.75a3.65 3.65 0 0 0-1.43-.27H33.77V15.7h14.96c.51 0 .99-.09 1.43-.28.44-.19.81-.44 1.13-.77.32-.32.58-.7.77-1.13.19-.43.29-.89.29-1.38 0-.49-.1-.95-.29-1.39a3.63 3.63 0 0 0-.77-1.13 3.55 3.55 0 0 0-1.13-.75 3.65 3.65 0 0 0-1.43-.27H33.77V0h14.96Z"/></svg>
    </div>
    <div class="divider"></div>
    <div class="grp">MAIN</div>
    <nav class="nav" id="nav-main"></nav>
    <div class="divider" style="margin-top:14px"></div>
    <div class="grp">SETTINGS</div>
    <nav class="nav" id="nav-settings"></nav>
    <button class="logout" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M16 8l4 4-4 4M20 12H9"/></svg>Log out</button>

    <div id="page"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const API='https://satta-matka-app-production.up.railway.app';
let TOKEN=''; try{TOKEN=localStorage.getItem('kg_admin_token')||''}catch(e){}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}
async function api(path,opts={}){
  const headers={'Content-Type':'application/json'};if(TOKEN)headers.Authorization='Bearer '+TOKEN;
  const r=await fetch(API+path,{...opts,headers});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error(d.error||('Error '+r.status));return d;
}
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const num=n=>Number(n||0).toLocaleString('en-IN');

/* ---------- icons ---------- */
function icon(n){const s='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';const p={
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="4" rx="1.5"/><rect x="14" y="10" width="7" height="11" rx="1.5"/><rect x="3" y="13" width="7" height="8" rx="1.5"/>',
  bars:'<path d="M4 20V10M9 20V4M14 20v-7M19 20V8"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11c.6.5 1 1.2 1 2h4c0-.8.4-1.5 1-2a6 6 0 0 0-3-11Z"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0M16 6a3 3 0 0 1 0 5M21 20a6 6 0 0 0-4-5.6"/>',
  users2:'<circle cx="12" cy="7" r="2.6"/><circle cx="5" cy="10" r="2.2"/><circle cx="19" cy="10" r="2.2"/><path d="M8 20a4 4 0 0 1 8 0M2 20a3.5 3.5 0 0 1 4-3.4M22 20a3.5 3.5 0 0 0-4-3.4"/>',
  chart:'<rect x="3" y="4" width="18" height="13" rx="2.5"/><path d="M7 13l3-3 2 2 4-4M9 21h6M12 17v4"/>',
  money:'<path d="M6 8h9a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6.5C5 5 6 4 7.5 4H15M9 12h5M11 9v6"/>',
  game:'<rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 12h3M9.5 10.5v3"/><circle cx="15.5" cy="11.5" r="1"/><circle cx="17.5" cy="13.5" r="1"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h13a3 3 0 0 1 0 6H3"/><circle cx="16.5" cy="13" r="1.1" fill="currentColor" stroke="none"/>',
  report:'<path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M15 3v4h4M9 12h6M9 16h4"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 4.6a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 15 4.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  trophy:'<path d="M8 4h8v4a4 4 0 0 1-8 0V4ZM6 4H4v2a3 3 0 0 0 3 3M18 4h2v2a3 3 0 0 1-3 3M10 16h4M9 20h6M12 12v4"/>',
  trend:'<path d="M4 18l5-5 3 3 7-8M15 8h5v5"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5ZM3 13l9 5 9-5M3 17l9 5 9-5"/>'
};return s+(p[n]||p.grid)+'</svg>'}

/* ---------- nav ---------- */
const NAV_MAIN=[
  {id:'dashboard',label:'Dashboard',icon:'grid'},
  {id:'markets',label:'Markets',icon:'bars'},
  {id:'prediction',label:'Winning Prediction',icon:'bulb'},
  {id:'users',label:'User Management',icon:'users'},
  {id:'subadmins',label:'Sub Admin Management',icon:'users2'},
  {id:'results',label:'Results',icon:'chart'},
  {id:'funds',label:'Funds',icon:'money'},
  {id:'games',label:'Games',icon:'game',sub:[
    {id:'games-rates',label:'Game Rates'},{id:'games-mgmt',label:'Game Management'},{id:'games-numbers',label:'Game Numbers'}]},
  {id:'wallet',label:'Wallet',icon:'wallet',sub:[
    {id:'wallet-withdraw',label:'Withdraw Request'},{id:'wallet-addfund',label:'Add Fund'},{id:'wallet-bidrevert',label:'Bid Revert'}]},
  {id:'reports',label:'Reports',icon:'report',sub:[
    {id:'reports-userbids',label:'User Bid History'},{id:'reports-sell',label:'Customer Sell'},{id:'reports-winning',label:'Winning'},
    {id:'reports-transfer',label:'Transfer Point'},{id:'reports-bidwin',label:'Bid Win'},{id:'reports-withdraw',label:'Withdraw'},{id:'reports-deposit',label:'Deposit'}]},
  {id:'notices',label:'Notices',icon:'bell',sub:[
    {id:'notices-mgmt',label:'Notice Management'},{id:'notices-send',label:'Send Notification'}]},
];
const NAV_SETTINGS=[
  {id:'settings',label:'Settings',icon:'gear',sub:[
    {id:'settings-main',label:'Main Settings'},{id:'settings-contact',label:'Contact Settings'},{id:'settings-slider',label:'Slider Images'},
    {id:'settings-howto',label:'How to Play'},{id:'settings-qr',label:'QR Images'},{id:'settings-ideas',label:'User Ideas'}]},
];
let CURRENT='dashboard';
function buildNav(){
  const render=(list)=>list.map(function(it){
    if(it.sub){
      const subs=it.sub.map(s=>'<a data-page="'+s.id+'" onclick="go(\''+s.id+'\')">'+s.label+'</a>').join('');
      return '<button class="item" data-group="'+it.id+'" onclick="toggleGroup(\''+it.id+'\')">'+icon(it.icon)+it.label+
        '<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>'+
        '<div class="subnav" data-subgroup="'+it.id+'">'+subs+'</div>';
    }
    return '<a data-page="'+it.id+'" onclick="go(\''+it.id+'\')">'+icon(it.icon)+it.label+'</a>';
  }).join('');
  document.getElementById('nav-main').innerHTML=render(NAV_MAIN);
  document.getElementById('nav-settings').innerHTML=render(NAV_SETTINGS);
}
function toggleGroup(id){
  const sub=document.querySelector('.subnav[data-subgroup="'+id+'"]');
  const btn=document.querySelector('.item[data-group="'+id+'"]');
  const open=sub.classList.toggle('open');btn.classList.toggle('grp-open',open);
}
function setActiveNav(page){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));
}
function go(page){
  CURRENT=page;setActiveNav(page);
  document.getElementById('side').classList.remove('open');
  const parent=[...NAV_MAIN,...NAV_SETTINGS].find(g=>g.sub&&g.sub.some(s=>s.id===page));
  if(parent){const sub=document.querySelector('.subnav[data-subgroup="'+parent.id+'"]');const btn=document.querySelector('.item[data-group="'+parent.id+'"]');if(sub&&!sub.classList.contains('open')){sub.classList.add('open');btn.classList.add('grp-open')}}
  (PAGES[page]||PAGES._todo)(page);
}

/* ---------- auth ---------- */
async function doLogin(){
  const username=document.getElementById('lg-user').value.trim();
  const password=document.getElementById('lg-pass').value;
  const token=document.getElementById('lg-totp').value.trim();
  const err=document.getElementById('lg-err');err.textContent='';
  if(!username||!password){err.textContent='Enter username and password';return}
  try{
    const body={username,password};if(token)body.token=token;
    const d=await api('/admin/login',{method:'POST',body:JSON.stringify(body)});
    if(d.totpRequired){document.getElementById('lg-totp-wrap').hidden=false;err.textContent='Enter your authenticator code';return}
    TOKEN=d.token;try{localStorage.setItem('kg_admin_token',TOKEN)}catch(e){}
    enterApp(d.admin);
  }catch(e){err.textContent=e.message||'Login failed'}
}
function logout(){TOKEN='';try{localStorage.removeItem('kg_admin_token')}catch(e){}document.getElementById('shell').hidden=true;document.getElementById('login').hidden=false}
function enterApp(admin){
  document.getElementById('login').hidden=true;document.getElementById('shell').hidden=false;
  if(admin&&admin.username)document.querySelector('.head h1').textContent='Hey, '+admin.username.charAt(0).toUpperCase()+admin.username.slice(1)+'!';
  document.getElementById('today').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',month:'short',day:'2-digit',year:'numeric'});
  buildNav();go('dashboard');
}

/* ---------- PAGES ---------- */
const PAGES={};
PAGES._todo=function(page){
  const label=[...NAV_MAIN,...NAV_SETTINGS].flatMap(g=>g.sub?[g,...g.sub]:[g]).find(x=>x.id===page);
  document.getElementById('page').innerHTML='<div class="panel"><div class="placeholder"><span class="pi">'+icon('layers')+'</span>'+
    '<h3>'+((label&&label.label)||page)+'</h3><p>This admin screen is designed and queued — it lands in the next build wave.</p></div></div>';
};

PAGES.dashboard=async function(){
  const el=document.getElementById('page');
  el.innerHTML='<div class="panel"><h2>Game Summary</h2><div class="loading">Loading…</div></div>';
  try{
    const d=await api('/admin/dashboard');const s=d.summary||{};
    const cards=[
      ['Play','game','#1c3550','#4aa3ff',num(s.play)],['Commission','money','#3a3410','#f5c542',num(s.commission)],
      ['Win','trophy','#3a1440','#e05bff',num(s.win)],['Profit','trend','#123324','#2fd07a',num(s.profit)],
      ['Loss','trend','#3a1414','#ff5a5f',num(s.loss)],['Deposit','wallet','#3a2410','#ff9a3c',inr(s.deposit)],
      ['Today Users','users','#3a1030','#ff4f9a',num(s.todayUsers)],['Total Users','users','#123324','#2fd07a',num(s.totalUsers)],
    ];
    const summary='<div class="panel"><h2>Game Summary</h2><div class="stat-grid">'+
      cards.map(c=>'<div class="stat"><div class="ic" style="background:'+c[2]+';color:'+c[3]+'">'+icon(c[1])+'</div><div class="val">'+c[4]+'</div><div class="lbl">'+c[0]+'</div></div>').join('')+'</div></div>';
    const gts=(d.gameTypes||[]);
    const overview='<div class="panel"><h2>Game Type Overview</h2>'+(gts.length?('<div class="gt-grid">'+
      gts.map(g=>'<div class="gt"><div class="gh"><span class="gi">🎲</span><b>'+g.gameType+'</b></div>'+
        '<div class="row">Total Bids: <b>'+num(g.totalBids)+'</b></div>'+
        '<div class="row">Bid Amount: <b>'+inr(g.bidAmount)+'</b></div>'+
        '<div class="row">Won: <b>'+num(g.won)+'</b></div>'+
        '<div class="row">Lost: <b>'+num(g.lost)+'</b></div></div>').join('')+'</div>')
      :'<p class="sub">No bids yet.</p>')+'</div>';
    el.innerHTML=summary+overview;
  }catch(e){el.innerHTML='<div class="panel"><p class="sub" style="color:var(--red)">'+e.message+'</p></div>'}
};

/* boot */
if(TOKEN){ api('/admin/me').then(d=>enterApp(d.admin)).catch(()=>{TOKEN='';try{localStorage.removeItem('kg_admin_token')}catch(e){}}); }
</script>
